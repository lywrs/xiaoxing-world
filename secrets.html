<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小星的秘密</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-title: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  --bg: #F7F0EA;
  --text: #5B5550;
  --text-light: #8A8278;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(232,201,163,0.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(216,232,216,0.05) 0%, transparent 40%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 28px 20px 60px;
}

/* ====== 标题区 ====== */
.header { text-align: center; margin-bottom: 28px; }
.header-title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.header-face {
  width: 62px;
  flex: none;
  object-fit: contain;
  filter: drop-shadow(0 3px 8px rgba(90,70,52,0.16));
  animation: faceFloat 3s ease-in-out infinite;
}
.face-r { display: inline-flex; flex: none; transform: scaleX(-1); }
@keyframes faceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (max-width: 480px) {
  .header-face { width: 46px; }
  .header-title-row { gap: 10px; }
}
.page-title {
  font-family: var(--font-title);
  font-size: 1.8rem;
  color: var(--text);
  margin-bottom: 6px;
}
.page-subtitle {
  font-size: 0.95rem;
  color: var(--text-light);
  line-height: 1.6;
}

/* 进度条 */
.progress-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.progress-bar {
  width: 120px;
  height: 6px;
  background: rgba(91,85,80,0.1);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #E8C9A3, #D4A574);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-text {
  font-size: 0.8rem;
  color: var(--text-light);
}

/* ====== 庆祝信息 ====== */
.celebration {
  display: none;
  text-align: center;
  margin-top: 24px;
  padding: 20px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(212,232,245,0.3), rgba(232,224,240,0.3));
  animation: fadeUp 0.6s ease;
}
.celebration.show { display: block; }
.celebration-icon { font-size: 2.5rem; margin-bottom: 8px; }
.celebration p {
  font-family: var(--font-title);
  font-size: 1.1rem;
  color: var(--text);
}

/* ====== 信封网格 ====== */
.envelope-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-top: 20px;
}
@media (min-width: 600px) {
  .envelope-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ====== 单个信封 ====== */
.envelope {
  position: relative;
  aspect-ratio: 4 / 3;
  cursor: pointer;
  transition: transform 0.2s;
}
.envelope.opened { cursor: default; }
.envelope:not(.opened):active { transform: scale(0.96); }

/* 信封身体 */
.envelope-body {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 75%;
  background: linear-gradient(160deg, #F5EDE3, #EBE0D4);
  border-radius: 2px 2px 6px 6px;
  box-shadow: 0 4px 12px rgba(91,85,80,0.1);
  border: 1px solid rgba(91,85,80,0.08);
  padding: 12px 10px 8px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  z-index: 1;
  overflow: hidden;
}
.envelope-body::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 50%;
  background: linear-gradient(to top, rgba(91,85,80,0.04), transparent);
}

.env-label {
  font-size: 0.62rem;
  color: var(--text-light);
  margin-bottom: 2px;
}
.env-recipient {
  font-size: 0.72rem;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 4px;
}
.env-title {
  font-family: var(--font-title);
  font-size: 0.85rem;
  color: var(--text);
}

/* 信封封口（三角形） */
.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 42%;
  background: linear-gradient(180deg, #EDE2D6, #E0D4C6);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  z-index: 3;
  border-radius: 2px 2px 0 0;
}
.envelope.opening .envelope-flap {
  transform: rotateX(180deg);
}

/* 火漆印章 */
.envelope-seal {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #E85D5D, #C9444A);
  border: 2px solid #D4A574;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: opacity 0.4s;
}
.envelope.opening .envelope-seal { opacity: 0; }

/* 已读标记 */
.envelope-read {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.7rem;
  color: #6BAF7A;
  z-index: 5;
  display: none;
}
.envelope.opened .envelope-read { display: block; }

/* 呼吸动画（当前可拆） */
.envelope:not(.opened).current {
  animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,201,163,0); }
  50% { transform: scale(1.03); box-shadow: 0 0 12px 4px rgba(232,201,163,0.2); }
}

/* ====== 弹窗 ====== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(91,85,80,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}
.modal-overlay.show { display: flex; }

.modal {
  width: 100%;
  max-width: 400px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 20px;
  background: var(--bg);
  position: relative;
  animation: slideUp 0.4s ease;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(91,85,80,0.08);
  font-size: 1rem;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.modal-close:active { background: rgba(91,85,80,0.2); }

.modal-content {
  padding: 32px 24px 24px;
}

/* 弹窗内「返回小星的家」按钮 */
.modal-home-btn {
  display: block;
  width: calc(100% - 48px);
  margin: 0 24px 22px;
  padding: 11px;
  border: 1.5px solid rgba(232, 201, 163, 0.55);
  border-radius: 30px;
  background: rgba(232, 201, 163, 0.16);
  color: #8A6A48;
  font-family: var(--font-title);
  font-size: 0.9rem;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.2s;
}
.modal-home-btn:hover { transform: translateY(-2px); }

.modal-num {
  font-family: var(--font-title);
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 16px;
  text-align: center;
}

.modal-quote {
  font-family: var(--font-title);
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text);
  text-align: center;
  margin-bottom: 20px;
  padding: 0 12px;
  position: relative;
}
.modal-quote::before, .modal-quote::after {
  font-size: 2rem;
  opacity: 0.2;
  position: absolute;
  line-height: 1;
}
.modal-quote::before { content: '\201C'; top: -16px; left: 0; }
.modal-quote::after { content: '\201D'; bottom: -24px; right: 0; }

.modal-section {
  margin-bottom: 18px;
}
.modal-section h4 {
  font-family: var(--font-title);
  font-size: 0.9rem;
  margin-bottom: 6px;
}
.modal-section p {
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--text);
}

.modal-explain {
  background: rgba(212,232,245,0.25);
  border-radius: 12px;
  padding: 14px 16px;
}
.modal-hint {
  background: rgba(232,201,163,0.15);
  border-left: 3px solid #E8C9A3;
  border-radius: 0 12px 12px 0;
  padding: 12px 14px;
}

.modal-next-btn {
  width: 100%;
  font-family: var(--font-title);
  font-size: 1rem;
  padding: 14px;
  border: none;
  border-radius: 40px;
  background: linear-gradient(135deg, #E8C9A3, #D4A574);
  color: #fff;
  cursor: pointer;
  margin-top: 8px;
  transition: transform 0.2s;
}
.modal-next-btn:active { transform: scale(0.97); }

/* 底部返回 */
.back-btn {
  display: block;
  margin: 40px auto 0;
  font-family: var(--font-title);
  font-size: 0.9rem;
  padding: 10px 28px;
  border: 2px solid rgba(232,201,163,0.3);
  border-radius: 30px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}

/* ====== 动画 ====== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="header-title-row">
      <img class="header-face" src="xz-face.webp" alt="小星" onerror="this.style.display='none'">
      <h1 class="page-title">🔍 小星的秘密</h1>
      <span class="face-r"><img class="header-face" src="xz-face.webp" alt="小星" onerror="this.parentElement.style.display='none'"></span>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0/6</span>
    </div>
  </div>

  <!-- 庆祝信息 -->
  <div class="celebration" id="celebration">
    <div class="celebration-icon">🎉</div>
    <p>你知道了小星的6个秘密！</p>
  </div>

  <!-- 信封网格 -->
  <div class="envelope-grid" id="envelopeGrid"></div>

  <button class="back-btn" onclick="goHome()">🏠 返回小星的家</button>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-content" id="modalContent"></div>
    <button class="modal-home-btn" id="modalHomeBtn">🏠 返回小星的家</button>
  </div>
</div>

<script>
(function() {
  var secrets = [
    {
      title: '声音像潮水',
      color: '#D4E8F5',
      quote: '有时候，我听到的声音比你们大很多很多。教室里的说话声、窗外的车声、灯管的嗡嗡声……它们全都一起涌进来，我分不清哪个更重要。',
      explain: '普通人的大脑会自动过滤不重要的声音，而自闭症孩子的大脑缺少这个\u201C过滤网\u201D。所以他们听到的世界，是全部声音同时播放的\u201C音墙\u201D。',
      hint: '说话时靠近我，用清楚的声音。'
    },
    {
      title: '眼睛太亮了',
      color: '#F5E8C8',
      quote: '我不是故意不看你。是眼睛里的光太刺眼了，像有一束聚光灯对着我。有时候我只能看到你的嘴巴在动，看不到你的表情。',
      explain: '自闭症孩子对光线更敏感，直视他人眼睛会触发\u201C超载\u201D反应。不看你，不代表不关心你，而是他们正在用其他方式听你说话。',
      hint: '不用强迫我看你的眼睛，我会用耳朵认真听。'
    },
    {
      title: '我喜欢重复',
      color: '#E8E0F0',
      quote: '做同一件事100遍，我会觉得很安心。一样的路线、一样的食物、一样的顺序……这些\u201C一样\u201D让我觉得世界是稳定的。',
      explain: '重复性行为是自闭症孩子建立\u201C秩序感\u201D和\u201C可预测性\u201D的方式，帮助他们降低焦虑。这不是固执，是他们的安全感来源。',
      hint: '尊重我的小习惯，它们是让我安心的锚。'
    },
    {
      title: '表情难懂',
      color: '#F5DCD0',
      quote: '别人的脸像一本我看不懂的书。你在笑，但你的眼睛没有笑。你说\u201C没事\u201D，但你的声音有点抖……我常常猜错你真正的意思。',
      explain: '自闭症孩子难以整合面部表情、语气和语言信息来推断他人情绪。这不是\u201C情商低\u201D，而是大脑的社交解码系统需要额外的时间和帮助。',
      hint: '请直接告诉我你的感受，我会努力理解。'
    },
    {
      title: '我的小世界',
      color: '#D8E8D8',
      quote: '我有一些特别喜欢的东西——转动的风扇、飘动的窗帘、排列整齐的石头……它们是我的宝藏，它们让我觉得开心和安全。',
      explain: '狭窄兴趣不是\u201C无聊的执着\u201D，而是自闭症孩子建立\u201C意义感\u201D的独特方式。在这些兴趣中，他们找到了专注、快乐和自信。',
      hint: '如果你愿意，我可以和你分享我喜欢的宝藏。'
    },
    {
      title: '满的时候',
      color: '#D8DCE8',
      quote: '当所有的声音、光线、信息一起涌进来的时候……我感觉自己像一杯装满了水的水杯。再多一滴，就会溢出来。',
      explain: '感官过载不是\u201C脾气差\u201D，而是神经系统的\u201C保护性熔断\u201D。在这种状态下，他们需要的是时间和安静，而不是说教或安慰。',
      hint: '当我需要安静的时候，请给我空间和时间。'
    }
  ];

  var nums = ['①','②','③','④','⑤','⑥'];
  var readCount = 0;
  var currentSecret = -1;
  var grid = document.getElementById('envelopeGrid');
  var overlay = document.getElementById('modalOverlay');
  var modalContent = document.getElementById('modalContent');
  var modalClose = document.getElementById('modalClose');
  var progressFill = document.getElementById('progressFill');
  var progressText = document.getElementById('progressText');
  var celebration = document.getElementById('celebration');

  // 生成信封
  function createEnvelopes() {
    secrets.forEach(function(s, i) {
      var env = document.createElement('div');
      env.className = 'envelope' + (i === 0 ? ' current' : '');
      env.dataset.index = i;
      env.innerHTML =
        '<div class="envelope-read">✅ 已读</div>' +
        '<div class="envelope-flap"></div>' +
        '<div class="envelope-seal">' + nums[i] + '</div>' +
        '<div class="envelope-body">' +
          '<div class="env-label">秘密 ' + nums[i] + '</div>' +
          '<div class="env-recipient">致 愿意了解我的人</div>' +
          '<div class="env-title">' + s.title + '</div>' +
        '</div>';
      env.addEventListener('click', function() { openEnvelope(i); });
      grid.appendChild(env);
    });
  }

  // 拆封
  function openEnvelope(index) {
    var env = grid.children[index];
    if (env.classList.contains('opened')) {
      showModal(index);
      return;
    }

    // 拆封动画
    env.classList.add('opening');
    setTimeout(function() {
      env.classList.remove('opening');
      env.classList.add('opened');
      env.classList.remove('current');
      if (!env.dataset.read) {
        env.dataset.read = '1';
        readCount++;
        updateProgress();
        // 标记下一个为 current
        for (var i = 0; i < grid.children.length; i++) {
          if (!grid.children[i].classList.contains('opened')) {
            grid.children[i].classList.add('current');
            break;
          }
        }
      }
      showModal(index);
    }, 600);
  }

  // 显示弹窗
  function showModal(index) {
    currentSecret = index;
    var s = secrets[index];
    var nextUnread = -1;
    for (var i = 0; i < secrets.length; i++) {
      if (!grid.children[i].dataset.read) { nextUnread = i; break; }
    }

    modalContent.innerHTML =
      '<div class="modal-num">秘密 ' + nums[index] + '</div>' +
      '<div class="modal-quote">' + s.quote + '</div>' +
      '<div class="modal-section modal-explain">' +
        '<h4>💡 原来是这样……</h4>' +
        '<p>' + s.explain + '</p>' +
      '</div>' +
      '<div class="modal-section modal-hint">' +
        '<h4>🤝 你可以这样帮我：</h4>' +
        '<p>' + s.hint + '</p>' +
      '</div>' +
      '<button class="modal-next-btn" id="nextBtn">' +
        (nextUnread >= 0 ? '下一个秘密 →' : '✨ 全部读完啦') +
      '</button>';

    overlay.classList.add('show');

    var nextBtn = document.getElementById('nextBtn');
    nextBtn.addEventListener('click', function() {
      if (nextUnread >= 0) {
        overlay.classList.remove('show');
        setTimeout(function() { openEnvelope(nextUnread); }, 300);
      } else {
        overlay.classList.remove('show');
        if (readCount >= 6) celebration.classList.add('show');
      }
    });
  }

  // 更新进度
  function updateProgress() {
    progressFill.style.width = (readCount / 6 * 100) + '%';
    progressText.textContent = readCount + '/6';
    if (readCount >= 6) {
      celebration.classList.add('show');
    }
  }

  // 关闭弹窗
  modalClose.addEventListener('click', function() {
    overlay.classList.remove('show');
  });
  // 返回小星的家：关闭弹窗并淡出直达 Hub
  document.getElementById('modalHomeBtn').addEventListener('click', function() {
    overlay.classList.remove('show');
    goHome();
  });
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  createEnvelopes();
})();
</script>
<script>
/* 页面淡入 + 返回小星的家（淡出后直达 Hub） */
(function() {
  var st = document.createElement('style');
  st.textContent = '@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}html,body{animation:pageFadeIn .5s ease both}';
  document.head.appendChild(st);
})();
function goHome() {
  document.body.style.animation = 'none';
  document.body.style.transition = 'opacity .45s ease';
  document.body.style.opacity = '0';
  setTimeout(function() { location.href = 'index.html#hub'; }, 450);
}
</script>

</body>
</html>
