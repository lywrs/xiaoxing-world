<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身边的支持 · 小星的世界</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-title: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  --warm: #E8C9A3;
  --warm-deep: #D4A574;
  --text-main: #F3EEE7;
  --text-sub: rgba(243, 238, 231, 0.72);
  --text-dim: rgba(243, 238, 231, 0.5);
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text-main);
  background: linear-gradient(180deg, #12102b 0%, #1d1440 45%, #251542 100%);
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 星空点缀 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.9) 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,0.6) 50%, transparent 51%),
    radial-gradient(2px 2px at 44% 10%, rgba(232,201,163,0.8) 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 38%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 74%, rgba(255,255,255,0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 84% 22%, rgba(232,201,163,0.7) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 56%, rgba(255,255,255,0.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 8% 84%, rgba(255,255,255,0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 90%, rgba(232,201,163,0.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 66% 8%, rgba(255,255,255,0.6) 50%, transparent 51%);
  animation: twinkle 5s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

/* ====== 顶部 ====== */
.header { text-align: center; margin-bottom: 18px; }
.header-title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.header-face {
  width: 62px;
  flex: none;
  object-fit: contain;
  filter: drop-shadow(0 3px 8px rgba(90,70,52,0.16));
  animation: faceFloat 3s ease-in-out infinite;
}
.face-r { display: inline-flex; flex: none; transform: scaleX(-1); }
@keyframes faceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (max-width: 480px) {
  .header-face { width: 46px; }
  .header-title-row { gap: 10px; }
}
.page-title {
  font-family: var(--font-title);
  font-size: 1.7rem;
  color: var(--warm);
  text-shadow: 0 2px 12px rgba(232, 201, 163, 0.25);
  margin-bottom: 6px;
}
.page-subtitle { font-size: 0.92rem; color: var(--text-sub); }

/* ====== 筛选区 ====== */
.filter-panel {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.select-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.select-wrap { position: relative; }
.select-wrap::after {
  content: "▾";
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  color: #8a7a68;
  pointer-events: none;
  font-size: 0.85rem;
}
select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: #F5EFE6;
  color: #4a4038;
  border: none;
  border-radius: 12px;
  padding: 11px 30px 11px 12px;
  font-size: 0.92rem;
  font-family: var(--font-body);
  cursor: pointer;
  outline: none;
  transition: box-shadow 0.25s;
}
select:focus { box-shadow: 0 0 0 2px rgba(232,201,163,0.65); }

.type-tags {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.type-tags::-webkit-scrollbar { display: none; }
.type-tag {
  flex-shrink: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--text-sub);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.85rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.25s;
}
.type-tag.active {
  background: linear-gradient(135deg, var(--warm), var(--warm-deep));
  border-color: transparent;
  color: #3a2f24;
  font-weight: 600;
}

/* ====== 提示行 ====== */
.result-hint {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.9rem;
  padding: 26px 10px;
}

/* ====== 分组 ====== */
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 2px 10px;
  font-family: var(--font-title);
  font-size: 1.05rem;
  color: var(--warm);
}
.group-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(232,201,163,0.4), transparent);
}

/* ====== 资源卡片 ====== */
.res-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 14px 14px 12px;
  margin-bottom: 12px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: border-color 0.3s;
}
.res-card.open { border-color: rgba(232,201,163,0.45); }
.res-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.res-name {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.35;
}
.res-tag {
  flex-shrink: 0;
  font-size: 0.72rem;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.tag-公办学校 { color: #8FC7FF; background: rgba(143,199,255,0.14); border-color: rgba(143,199,255,0.4); }
.tag-家长互助 { color: #93E3AE; background: rgba(147,227,174,0.13); border-color: rgba(147,227,174,0.4); }
.tag-公益组织 { color: #F2C879; background: rgba(242,200,121,0.14); border-color: rgba(242,200,121,0.4); }
.tag-大龄托养 { color: #CBA9F5; background: rgba(203,169,245,0.14); border-color: rgba(203,169,245,0.4); }
.res-badge {
  display: inline-block;
  margin-left: 6px;
  font-size: 0.68rem;
  color: #FFD9B0;
  background: rgba(255,217,176,0.12);
  border: 1px solid rgba(255,217,176,0.35);
  border-radius: 999px;
  padding: 2px 8px;
  vertical-align: 1px;
}
.res-desc { font-size: 0.86rem; color: var(--text-sub); line-height: 1.55; margin-top: 7px; }
.res-meta { margin-top: 9px; display: grid; gap: 5px; }
.res-meta-row {
  display: flex;
  gap: 7px;
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.5;
}
.res-meta-row .ico { flex-shrink: 0; }
.res-meta-row span:last-child { word-break: break-all; }

.more-btn {
  margin-top: 11px;
  width: 100%;
  background: transparent;
  border: 1px solid rgba(232,201,163,0.6);
  color: var(--warm);
  border-radius: 12px;
  padding: 8px 0;
  font-size: 0.86rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.25s;
}
.more-btn:hover { background: rgba(232,201,163,0.12); }

.res-more {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.35s ease, margin-top 0.4s ease;
  margin-top: 0;
}
.res-card.open .res-more { opacity: 1; margin-top: 12px; }
.more-inner {
  border-top: 1px dashed rgba(232,201,163,0.3);
  padding-top: 11px;
  display: grid;
  gap: 7px;
}
.more-row { display: flex; gap: 8px; font-size: 0.83rem; line-height: 1.55; }
.more-row .k { flex-shrink: 0; color: var(--warm); opacity: 0.85; }
.more-row .v { color: var(--text-sub); word-break: break-all; }
.more-note {
  margin-top: 3px;
  font-size: 0.8rem;
  color: #E8D5BC;
  background: rgba(232,201,163,0.1);
  border-radius: 10px;
  padding: 8px 10px;
  line-height: 1.6;
}
.res-img-box {
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255,255,255,0.05);
}
.res-img-box.loading {
  min-height: 96px;
  border: 1px dashed rgba(232,201,163,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  color: var(--text-dim);
}
.res-img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}
.res-img-cap {
  font-size: 0.72rem;
  color: var(--text-dim);
  padding: 6px 10px 7px;
  background: rgba(0,0,0,0.18);
  text-align: center;
}

/* ====== 空状态 ====== */
.empty-box {
  text-align: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 30px 18px;
  margin-top: 6px;
}
.empty-emoji { font-size: 2.2rem; margin-bottom: 10px; }
.empty-title { font-size: 1rem; color: var(--text-main); margin-bottom: 10px; line-height: 1.6; }
.empty-tips { text-align: left; display: inline-block; color: var(--text-dim); font-size: 0.86rem; line-height: 1.9; margin-bottom: 16px; }
.empty-tips li { list-style: none; }
.empty-tips li::before { content: "· "; color: var(--warm); }
.reco-btn {
  background: linear-gradient(135deg, var(--warm), var(--warm-deep));
  color: #3a2f24;
  border: none;
  border-radius: 999px;
  padding: 10px 26px;
  font-size: 0.9rem;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
}
.reco-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(232,201,163,0.3); }

/* ====== 底部 ====== */
.footer { text-align: center; margin-top: 26px; }
.back-btn {
  position: fixed;
  top: 18px;
  left: 16px;
  z-index: 100;
  background: linear-gradient(135deg, #E8C9A3 0%, #F0D5C0 100%);
  color: #4A3A28;
  border: none;
  border-radius: 14px;
  padding: 10px 22px;
  font-size: 0.95rem;
  font-family: var(--font-title);
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 4px 14px rgba(232, 201, 163, 0.4);
}
.back-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(232,201,163,0.35); }
.disclaimer {
  margin-top: 16px;
  font-size: 0.74rem;
  color: var(--text-dim);
  line-height: 1.7;
}

/* ====== 推荐弹窗 ====== */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(10,5,25,0.8);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }
.modal-card {
  width: 100%;
  max-width: 420px;
  max-height: 86vh;
  overflow-y: auto;
  background: linear-gradient(170deg, #241a45 0%, #1a1236 100%);
  border: 1px solid rgba(232,201,163,0.4);
  border-radius: 18px;
  padding: 20px 18px;
  transform: translateY(16px);
  transition: transform 0.3s;
}
.modal-mask.show .modal-card { transform: translateY(0); }
.modal-title {
  font-family: var(--font-title);
  color: var(--warm);
  font-size: 1.15rem;
  text-align: center;
  margin-bottom: 4px;
}
.modal-sub { text-align: center; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px; }
.form-grid { display: grid; gap: 11px; }
.form-item label { display: block; font-size: 0.82rem; color: var(--text-sub); margin-bottom: 5px; }
.form-item label .req { color: #F2A6A6; margin-left: 2px; }
.form-item input, .form-item select, .form-item textarea {
  width: 100%;
  background: #F5EFE6;
  color: #4a4038;
  border: none;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 0.9rem;
  font-family: var(--font-body);
  outline: none;
}
.form-item textarea { resize: vertical; min-height: 56px; }
.modal-btns { display: flex; gap: 10px; margin-top: 6px; }
.modal-btns button {
  flex: 1;
  border-radius: 999px;
  padding: 10px 0;
  font-size: 0.92rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.25s;
}
.btn-ghost {
  background: transparent;
  border: 1px solid rgba(232,201,163,0.55);
  color: var(--warm);
}
.btn-solid {
  background: linear-gradient(135deg, var(--warm), var(--warm-deep));
  border: none;
  color: #3a2f24;
  font-weight: 600;
}
.modal-thanks { text-align: center; padding: 26px 6px; }
.modal-thanks .big { font-size: 2.4rem; margin-bottom: 12px; }
.modal-thanks p { color: var(--text-sub); font-size: 0.92rem; line-height: 1.8; }
</style>
</head>
<body>
<div class="page">

  <!-- ====== 顶部 ====== -->
  <div class="header">
    <div class="header-title-row">
      <img class="header-face" src="xz-face.webp" alt="小星" onerror="this.style.display='none'">
      <div class="page-title">📍 身边的支持</div>
      <span class="face-r"><img class="header-face" src="xz-face.webp" alt="小星" onerror="this.parentElement.style.display='none'"></span>
    </div>
    <div class="page-subtitle">找到你身边的支持与陪伴</div>
  </div>

  <!-- ====== 筛选区 ====== -->
  <div class="filter-panel">
    <div class="select-grid">
      <div class="select-wrap">
        <select id="provinceSel">
          <option value="">选择省份</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="citySel" disabled>
          <option value="">选择城市</option>
        </select>
      </div>
    </div>
    <div class="type-tags" id="typeTags">
      <button class="type-tag active" data-type="全部">全部</button>
      <button class="type-tag" data-type="公办学校">公办学校</button>
      <button class="type-tag" data-type="家长互助">家长互助</button>
      <button class="type-tag" data-type="公益组织">公益组织</button>
      <button class="type-tag" data-type="大龄托养">大龄托养</button>
    </div>
  </div>

  <!-- ====== 结果区 ====== -->
  <div id="resultArea">
    <div class="result-hint">请先选择省份和城市，小星带你看看身边的资源 ✨</div>
  </div>

  <!-- ====== 底部 ====== -->
  <div class="footer">
    <button class="back-btn" id="backHome">🏠 返回小星的家</button>
    <div class="disclaimer">*本页面信息来源于公开渠道整理，仅供参考。建议联系前通过官方渠道核实最新信息。</div>
  </div>

</div>

<!-- ====== 推荐资源弹窗 ====== -->
<div class="modal-mask" id="recoModal">
  <div class="modal-card">
    <div id="recoFormWrap">
      <div class="modal-title">💛 推荐身边的资源</div>
      <div class="modal-sub">你推荐的每一条信息，都可能帮到一个家庭</div>
      <form id="recoForm" class="form-grid">
        <div class="form-item">
          <label>机构名称<span class="req">*</span></label>
          <input type="text" id="recoName" maxlength="60" placeholder="请输入机构全称" required>
        </div>
        <div class="form-item">
          <label>机构类型<span class="req">*</span></label>
          <select id="recoType" required>
            <option value="">请选择类型</option>
            <option>公办学校</option>
            <option>家长互助</option>
            <option>公益组织</option>
            <option>大龄托养</option>
          </select>
        </div>
        <div class="form-item">
          <label>地址</label>
          <input type="text" id="recoAddr" maxlength="120" placeholder="省 / 市 / 详细地址（选填）">
        </div>
        <div class="form-item">
          <label>联系方式</label>
          <input type="text" id="recoContact" maxlength="80" placeholder="电话 / 公众号 / 官网（选填）">
        </div>
        <div class="form-item">
          <label>推荐人姓名<span class="req">*</span></label>
          <input type="text" id="recoFrom" maxlength="30" placeholder="怎么称呼你呀" required>
        </div>
        <div class="form-item">
          <label>推荐人联系方式（可选）</label>
          <input type="text" id="recoFromContact" maxlength="80" placeholder="方便我们向你反馈核实进展">
        </div>
        <div class="modal-btns">
          <button type="button" class="btn-ghost" id="recoCancel">取消</button>
          <button type="submit" class="btn-solid">提交推荐</button>
        </div>
      </form>
    </div>
    <div class="modal-thanks" id="recoThanks" style="display:none;">
      <div class="big">🌟</div>
      <p>谢谢你！小星已经收到你推荐的资源啦。<br>我们会尽快核实并收录，<br>让更多家庭找到身边的温暖 💛</p>
    </div>
  </div>
</div>

var TYPE_ICONS = { "公办学校": "🏫", "家长互助": "🤝", "公益组织": "💛", "大龄托养": "🏡" };
var NO_CONTACT = "暂无公开联系方式，建议通过属地教育局或官方渠道咨询";

var provinceSel = document.getElementById("provinceSel");
var citySel = document.getElementById("citySel");

var recoModal = document.getElementById("recoModal");

var curType = "全部";

/* ====== 初始化省份下拉 ====== */
PROVINCES.forEach(function(p) {
  var opt = document.createElement("option");
  opt.value = p; opt.textContent = p;
  provinceSel.appendChild(opt);
});

/* ====== 省份 → 城市联动 ====== */
provinceSel.addEventListener("change", function() {
  citySel.innerHTML = '<option value="">选择城市</option>';
  var p = provinceSel.value;
  if (!p) {
    citySel.disabled = true;
    renderHint("请先选择省份和城市，小星带你看看身边的资源 ✨");
    return;
  }
  CITY_MAP[p].forEach(function(c) {
    var opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    citySel.appendChild(opt);
  });
  citySel.disabled = false;
  renderHint("再选一个城市，看看那里有什么资源吧 🏙️");
});

/* ====== 类型标签 ====== */
typeTags.addEventListener("click", function(e) {
  var btn = e.target.closest(".type-tag");
  if (!btn) return;
  typeTags.querySelectorAll(".type-tag").forEach(function(t) { t.classList.remove("active"); });
  btn.classList.add("active");
  curType = btn.getAttribute("data-type");
  renderList();
});

/* ====== 城市选择 → 渲染列表 ====== */
citySel.addEventListener("change", renderList);

function renderHint(text) {
  resultArea.innerHTML = '<div class="result-hint">' + text + "</div>";
}

function renderList() {
  var p = provinceSel.value, c = citySel.value;
  if (!p || !c) { renderHint("请先选择省份和城市，小星带你看看身边的资源 ✨"); return; }

  var local = RESOURCES.filter(function(r) { return r.province === p && r.city === c; });
  var national = RESOURCES.filter(function(r) { return r.national; });

  /* 城市无本地收录资源 → 空状态提示 + 推荐入口，全国性资源列在下方供参考 */
  if (!local.length) { renderEmpty(p, c, national); return; }

  var list = local.concat(national);
  if (curType !== "全部") {
    list = list.filter(function(r) { return r.type === curType; });
    if (!list.length) { renderEmpty(p, c, []); return; }
  }

  var html = "";
  TYPE_ORDER.forEach(function(t) {
    var group = list.filter(function(r) { return r.type === t; });
    if (!group.length) return;
    html += '<div class="group-title">' + TYPE_ICONS[t] + " " + t + "</div>";
    group.forEach(function(r) { html += cardHTML(r); });
  });
  resultArea.innerHTML = html;
  bindCards();
}

function cardHTML(r) {
  var contact = r.phone || NO_CONTACT;
  var badge = r.national ? '<span class="res-badge">全国</span>' : "";
  var moreRows =
    '<div class="more-row"><span class="k">类型：</span><span class="v">' + r.type + "</span></div>" +
    '<div class="more-row"><span class="k">地址：</span><span class="v">' + (r.address || (r.national ? "全国性项目" : "暂无")) + "</span></div>" +
    '<div class="more-row"><span class="k">联系：</span><span class="v">' + contact + "</span></div>" +
    (r.more ? '<div class="more-note">💡 ' + r.more + "</div>" : "");
  return (
    '<div class="res-card" data-name="' + r.name + '">' +
      '<div class="res-top">' +
        '<div class="res-name">' + r.name + badge + "</div>" +
        '<span class="res-tag tag-' + r.type + '">' + r.type + "</span>" +
      "</div>" +
      '<div class="res-desc">' + r.desc + "</div>" +
      '<div class="res-meta">' +
        '<div class="res-meta-row"><span class="ico">📍</span><span>' + (r.address || (r.national ? "全国性项目" : "暂无")) + "</span></div>" +
        '<div class="res-meta-row"><span class="ico">📞</span><span>' + contact + "</span></div>" +
      "</div>" +
      '<button class="more-btn">了解更多 ▾</button>' +
      '<div class="res-more"><div class="more-inner"><div class="res-img-box"></div>' + moreRows + "</div></div>" +
    "</div>"
  );
}

/* 首次展开时加载地点示意图（本地图片，加载完成后再撑开高度） */
function loadImage(r, card, more) {
  var box = card.querySelector(".res-img-box");
  if (!box || box.dataset.done) return;
  box.dataset.done = "1";
  if (!r.img) { box.remove(); return; }
  box.classList.add("loading");
  box.textContent = "📍 图片加载中…";
  var im = new Image();
  im.className = "res-img";
  im.alt = r.name + " 位置示意图";
  im.onload = function() {
    box.classList.remove("loading");
    box.textContent = "";
    box.appendChild(im);
    var cap = document.createElement("div");
    cap.className = "res-img-cap";
    cap.textContent = "📍 位置示意图（底图：高德地图），仅供参考";
    box.appendChild(cap);
    if (card.classList.contains("open")) {
      more.style.maxHeight = more.scrollHeight + "px";
    }
  };
  im.onerror = function() {
    box.classList.remove("loading");
    box.textContent = "图片暂时加载不出来，请稍后再试";
  };
  im.src = r.img;
}

function bindCards() {
  resultArea.querySelectorAll(".res-card").forEach(function(card) {
    var btn = card.querySelector(".more-btn");
    var more = card.querySelector(".res-more");
    var r = null;
    RESOURCES.forEach(function(x) { if (x.name === card.getAttribute("data-name")) r = x; });
    btn.addEventListener("click", function() {
      var opening = !card.classList.contains("open");
      if (opening) {
        if (r) loadImage(r, card, more);
        more.style.maxHeight = more.scrollHeight + "px";
        card.classList.add("open");
        btn.textContent = "收起 ▴";
      } else {
        more.style.maxHeight = "0";
        card.classList.remove("open");
        btn.textContent = "了解更多 ▾";
      }
    });
  });
}

/* ====== 空状态 + 推荐表单 ====== */
function renderEmpty(p, c, national) {
  var filtered = national || [];
  if (curType !== "全部") {
    filtered = filtered.filter(function(r) { return r.type === curType; });
  }
  var html =
    '<div class="empty-box">' +
      '<div class="empty-emoji">🌌</div>' +
      '<div class="empty-title">' + c + " 暂无收录的资源</div>" +
      '<ul class="empty-tips">' +
        "<li>选择附近的城市看看</li>" +
        "<li>点击下方按钮，推荐你身边的资源</li>" +
      "</ul><br>" +
      '<button class="reco-btn" id="openReco">✨ 推荐你身边的资源</button>' +
    "</div>";
  if (filtered.length) {
    html += '<div class="group-title">🌐 全国性资源（各地均可参考）</div>';
    filtered.forEach(function(r) { html += cardHTML(r); });
  }
  resultArea.innerHTML = html;
  bindCards();
  document.getElementById("openReco").addEventListener("click", function() {
    recoModal.classList.add("show");
  });
}

document.getElementById("recoCancel").addEventListener("click", function() {
  recoModal.classList.remove("show");
  setTimeout(function() {
    document.getElementById("recoFormWrap").style.display = "";
    document.getElementById("recoThanks").style.display = "none";
    document.getElementById("recoForm").reset();
  }, 320);
});
recoModal.addEventListener("click", function(e) {
  if (e.target === recoModal) document.getElementById("recoCancel").click();
});

  e.preventDefault();
  var rec = {
    name: document.getElementById("recoName").value.trim(),
    type: document.getElementById("recoType").value,
    address: document.getElementById("recoAddr").value.trim(),
    contact: document.getElementById("recoContact").value.trim(),

    fromContact: document.getElementById("recoFromContact").value.trim(),

    time: new Date().toISOString()
  };
  try {
    var arr = JSON.parse(localStorage.getItem("support-suggestions") || "[]");
    arr.push(rec);
    localStorage.setItem("support-suggestions", JSON.stringify(arr));
  } catch (err) {}
  document.getElementById("recoFormWrap").style.display = "none";
  document.getElementById("recoThanks").style.display = "";
});

/* ====== 页面淡入 + 返回小星的家（淡出后跳 Hub） ====== */
(function() {
  var st = document.createElement("style");
  st.textContent = "@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}html,body{animation:pageFadeIn .5s ease both}";
  document.head.appendChild(st);
  function goHome() {
    document.body.style.animation = "none";
    document.body.style.transition = "opacity .45s ease";
    document.body.style.opacity = "0";
    setTimeout(function() { window.location.href = "index.html#hub"; }, 450);
  }
  document.getElementById("backHome").addEventListener("click", goHome);
})();
</script>
