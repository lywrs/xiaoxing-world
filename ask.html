<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>问小星 🤖</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-title: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  --bg: #F7F0EA;
  --text: #5B5550;
  --text-light: #8A8278;
  --warm: #E8C9A3;
  --warm-dark: #D4A574;
  --warm-gold-1: #F5D58B;
  --warm-gold-2: #E8B865;
  --card-bg: #FFFFFF;
  --link: #D4A574;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 18px 32px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ====== 左上角返回按钮 ====== */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 8px 16px;
  background: #fff;
  color: var(--text);
  font-size: 0.85rem;
  text-decoration: none;
  border-radius: 999px;
  border: 1px solid var(--warm);
  box-shadow: 0 2px 6px rgba(212,165,116,0.18);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  margin-bottom: 18px;
}
.back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(212,165,116,0.28); }
.back-btn:active { transform: scale(0.97); }

/* ====== 顶部标题区 ====== */
.header {
  text-align: center;
  margin-bottom: 22px;
  padding: 0 6px;
}
.header-title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.header-face {
  width: 70px;
  flex: none;
  object-fit: contain;
  filter: drop-shadow(0 3px 8px rgba(90,70,52,0.16));
  animation: faceFloat 3s ease-in-out infinite;
}
.face-r { display: inline-flex; flex: none; transform: scaleX(-1); }
@keyframes faceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (max-width: 480px) {
  .header-face { width: 52px; }
  .header-title-row { gap: 10px; }
}
.page-title {
  font-family: var(--font-title);
  font-size: 2.3rem;
  color: #5A4634;
  margin-bottom: 6px;
}
.page-subtitle {
  font-size: 1.05rem;
  color: var(--text-light);
  margin-bottom: 14px;
}
.page-hint {
  display: inline-block;
  padding: 10px 18px;
  background: rgba(232,201,163,0.25);
  border-radius: 14px;
  font-size: 0.88rem;
  color: #7A6A55;
  line-height: 1.6;
  max-width: 100%;
}

/* ====== 问答主卡片 ====== */
.chat-card {
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 6px 22px rgba(212,165,116,0.18);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 60vh;
}

.chat-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 22px;
  background: linear-gradient(135deg, #FBF1E2 0%, #F5E5D0 100%);
  border-bottom: 1px solid rgba(212,165,116,0.18);
}
.chat-head-face {
  width: 54px; height: 54px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  flex-shrink: 0;
}
.chat-head-txt { flex: 1; min-width: 0; }
.chat-head-name { font-family: var(--font-title); font-size: 1.28rem; color: #5A4634; }
.chat-head-status { font-size: 0.84rem; color: #7A8A6A; display: flex; align-items: center; gap: 5px; }
.chat-dot-online { width: 7px; height: 7px; border-radius: 50%; background: #7EAE70; display: inline-block; box-shadow: 0 0 0 3px rgba(126,174,112,0.18); }
.chat-dot-off { width: 7px; height: 7px; border-radius: 50%; background: #C9C2B8; display: inline-block; }
.chat-reset {
  border: none; background: #fff; color: #7A6A55;
  font-size: 0.88rem; padding: 8px 15px; border-radius: 999px;
  cursor: pointer; border: 1px solid var(--warm);
  transition: background 0.18s;
  flex-shrink: 0;
}
.chat-reset:hover { background: #EBDFCC; }

.chat-window {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: #FBF7F2;
  min-height: 320px;
  max-height: 56vh;
}
.chat-window::-webkit-scrollbar { width: 5px; }
.chat-window::-webkit-scrollbar-thumb { background: rgba(212,165,116,0.35); border-radius: 3px; }

.msg { display: flex; gap: 10px; max-width: 88%; animation: msgIn 0.35s ease both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.bot { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-face {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  flex-shrink: 0;
}
.msg-bubble {
  padding: 14px 18px;
  border-radius: 18px;
  font-size: 1.05rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.bot .msg-bubble {
  background: #fff;
  color: var(--text);
  border-top-left-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--warm-gold-1), var(--warm-gold-2));
  color: #4A3A24;
  border-top-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(232,184,101,0.25);
}
.msg-bubble .src-link {
  display: inline-block;
  margin-top: 8px;
  margin-right: 8px;
  padding: 5px 12px;
  font-size: 0.84rem;
  color: var(--warm-dark);
  background: rgba(212,165,116,0.12);
  border-radius: 999px;
  text-decoration: none;
}
.msg-bubble .src-link:hover { background: rgba(212,165,116,0.22); }

.typing-bubble { display: inline-flex; gap: 4px; padding: 12px 16px; }
.typing-bubble span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--warm-dark);
  animation: typingDot 1.2s infinite ease-in-out;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

/* 流式输出光标 */
.stream-cursor {
  display: inline-block;
  color: var(--warm-dark);
  font-weight: bold;
  animation: blink 0.9s infinite;
  margin-left: 1px;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

.msg-follow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px 54px; }
.follow-chip {
  border: 1px solid var(--warm);
  background: #fff;
  color: #7A6A55;
  font-size: 0.88rem;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, transform 0.18s;
}
.follow-chip:hover { background: rgba(232,201,163,0.28); }
.follow-chip:active { transform: scale(0.96); }

/* ====== 帮助反馈行 ====== */
.feedback-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 0.84rem;
  color: var(--text-light);
}
.feedback-btn {
  border: 1px solid var(--warm);
  background: #fff;
  color: #7A6A55;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.84rem;
  transition: background 0.18s, transform 0.18s;
}
.feedback-btn:hover { background: rgba(232,201,163,0.22); }
.feedback-btn.active { background: var(--warm-gold-2); color: #fff; border-color: var(--warm-gold-2); }

/* ====== 快捷标签 ====== */
.chat-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 18px;
  background: #FBF7F2;
  border-top: 1px solid rgba(212,165,116,0.12);
}
.chat-chip {
  border: 1px solid var(--warm);
  background: #fff;
  color: #7A6A55;
  font-size: 0.92rem;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s, transform 0.18s;
}
.chat-chip:hover { background: rgba(232,201,163,0.28); }
.chat-chip:active { transform: scale(0.95); }

/* ====== 输入区 ====== */
.chat-input-row {
  display: flex;
  gap: 10px;
  padding: 16px 22px 18px;
  background: #fff;
  border-top: 1px solid rgba(212,165,116,0.12);
  align-items: flex-end;
}
.chat-input {
  flex: 1;
  border: 1.5px solid var(--warm);
  border-radius: 16px;
  padding: 14px 18px;
  font-size: 1.05rem;
  font-family: var(--font-body);
  resize: none;
  min-height: 54px;
  max-height: 140px;
  line-height: 1.5;
  background: #FFFCF7;
  color: var(--text);
  outline: none;
  transition: border-color 0.18s;
}
.chat-input:focus { border-color: var(--warm-dark); }
.chat-send {
  border: none;
  background: linear-gradient(135deg, var(--warm-gold-1), var(--warm-gold-2));
  color: #4A3A24;
  font-family: var(--font-title);
  font-size: 1.08rem;
  padding: 14px 26px;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(232,184,101,0.35);
  transition: transform 0.18s, box-shadow 0.18s;
  flex-shrink: 0;
  white-space: nowrap;
}
.chat-send:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(232,184,101,0.42); }
.chat-send:active { transform: scale(0.97); }
.chat-send:disabled { opacity: 0.5; cursor: default; }

.chat-tagline {
  text-align: center;
  font-size: 0.82rem;
  color: var(--text-light);
  padding: 0 12px 12px;
  background: #fff;
}

/* ====== 手机端适配 ====== */
@media (max-width: 480px) {
  .page { padding: 14px 12px 24px; }
  .page-title { font-size: 1.85rem; }
  .page-subtitle { font-size: 0.95rem; }
  .page-hint { font-size: 0.82rem; padding: 8px 14px; }
  .chat-head { padding: 12px 16px; gap: 10px; }
  .chat-head-face { width: 44px; height: 44px; }
  .chat-head-name { font-size: 1.1rem; }
  .chat-window { padding: 16px; max-height: 50vh; }
  .msg-bubble { font-size: 0.98rem; padding: 12px 15px; }
  .chat-input-row { padding: 12px 14px 14px; gap: 8px; }
  .chat-input { font-size: 0.98rem; padding: 12px 15px; min-height: 48px; }
  .chat-send { padding: 12px 20px; font-size: 0.98rem; }
  .msg-follow { margin-left: 50px; }
}
</style>
</head>
<body>
<div class="page">

  <a class="back-btn" href="index.html#hub">← 返回小星的家</a>

  <div class="header">
    <div class="header-title-row">
      <img class="header-face" src="xz-face.webp" alt="小星" onerror="this.style.display='none'">
      <h1 class="page-title">🤖 问小星</h1>
      <span class="face-r"><img class="header-face" src="xz-face.webp" alt="小星" onerror="this.parentElement.style.display='none'"></span>
    </div>
    <p class="page-subtitle">有什么想问的？小星在这里听着呢 💛</p>
    <div class="page-hint">你可以问：什么是感官过载？｜怎么和自闭症孩子相处？｜自闭症的早期征兆有哪些？</div>
  </div>

  <div class="chat-card">
    <div class="chat-head">
      <img class="chat-head-face" src="xz-face.webp" alt="小星" onerror="this.style.display='none'">
      <div class="chat-head-txt">
        <div class="chat-head-name">小星 · AI 智能伙伴</div>
        <div class="chat-head-status"><span class="chat-dot-online" id="aiModeDot"></span><span id="aiModeText">AI 大模型在线，随时可以问我哦</span></div>
      </div>
      <button class="chat-reset" id="chatReset" title="清空对话记忆，重新开始">🧹 重新开始</button>
    </div>
    <div class="chat-window" id="chatWindow"></div>
    <div class="chat-quick" id="chatQuick"></div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chatInput" placeholder="输入你想问的问题……" rows="1" maxlength="300"></textarea>
      <button class="chat-send" id="chatSend">问问小星 ✨</button>
    </div>
    <div class="chat-tagline">小星的回答由 AI 生成，仅供参考 · 医疗诊断请咨询正规医院与专业机构</div>
  </div>

</div>

<script>
(function() {
  // ====== 预置知识库（从 friends.html 迁移，AI 不可用时兜底） ======
  var knowledgeBase = [
    {
      keywords: ['不看', '眼睛', '对视', '眼神'],
      answer: '这个问题问得真好……\n\n我不是故意不看你的眼睛的。根据研究和科普资料，自闭症孩子在直视他人眼睛时，大脑会产生"超载"反应，感觉就像被聚光灯直射一样刺眼。这不代表我不关心你，而是我正在用耳朵认真听你说话。\n\n有些自闭症孩子会学会看着对方的鼻子或额头来"假装"对视，这样既不会太难受，也能让对方感到被尊重。\n\n希望这个回答能帮到你！',
      sources: [
        { name: 'Autism Speaks - 眼神接触', url: 'https://www.autismspeaks.org' }
      ]
    },
    {
      keywords: ['不怕吵', '怕吵', '声音', '噪音', '捂耳朵', '听觉'],
      answer: '是的，很多自闭症孩子对声音特别敏感。\n\n我们的大脑处理感官信息的方式和神经典型的人不太一样。日常环境里我们觉得没什么的声音——吸尘器、电视机、人群喧闹、甚至撕纸——对某些自闭症孩子来说可能像针扎一样难受，这就是"感官过载"。\n\n所以你可能会看到我捂耳朵、突然哭闹、想离开某个地方。这不是"不听话"，是大脑真的在喊"太吵了，我受不了"。',
      sources: [
        { name: 'Autism Research Institute - 感官', url: 'https://www.autism.com' }
      ]
    },
    {
      keywords: ['不说话', '语言', '开口', '说话晚', '不会说话', '不说话怎么办'],
      answer: '不说话，不一定是不想说——很多时候是"还没准备好"。\n\n自闭症孩子语言发展的节奏差异很大，有的两三岁仍不开口，有的晚一些会突然讲很多。重要的不是逼着孩子"快开口"，而是给他一个低压、被理解的表达环境。\n\n可以试试：\n· 用图片、手势、表情和他沟通，让他知道"不说话也能被理解"\n· 一起做他感兴趣的事，在互动中自然地加一句简短的旁白\n· 不要反复问"叫妈妈""说再见"，压力大反而更难开口\n\n如果孩子过了两岁仍没有任何语言迹象，建议找专业的语言治疗师评估一下。',
      sources: [
        { name: '美国CDC - 语言发育', url: 'https://www.cdc.gov/ncbddd/autism/signs.html' }
      ]
    },
    {
      keywords: ['名字', '反应', '不理', '听不见', '叫名字', '叫没反应'],
      answer: '叫他名字，他好像听不见——很多家长都被这件事吓到过。\n\n这不是听力有问题，更多时候是大脑"分配注意力"的方式不同。神经典型的人听见自己名字会本能地抬头，但很多自闭症孩子需要先把正在做的事做完，才能切换到新的信息源。\n\n可以试着：\n· 蹲下来，和他平视，轻轻碰一下他的肩膀，再叫名字\n· 不要连喊好几遍，间隔几秒，给他反应的时间\n· 如果经常没反应，可以让医生做一次听力检查，排除听力问题',
      sources: [
        { name: 'Autism Speaks - 早期征兆', url: 'https://www.autismspeaks.org/signs-autism' }
      ]
    },
    {
      keywords: ['踮脚', '踮着脚', '脚尖'],
      answer: '踮着脚走路，是很多自闭症孩子的小习惯。\n\n一部分是感官原因——脚尖受力能带来"扎实感"，像被稳稳按在地面上，反而让身体觉得安心；一部分是肌张力偏低或跟腱稍紧。\n\n如果孩子偶尔踮脚、其它发展都还好，可以先观察；如果一直踮脚，影响走路姿势或脚跟疼痛，建议找儿科或康复科评估，必要时做一些简单的伸展。',
      sources: [
        { name: 'PubMed - 踮脚步行', url: 'https://www.ncbi.nlm.nih.gov' }
      ]
    },
    {
      keywords: ['转圈', '原地转', '旋转', '刻板', '重复'],
      answer: '转圈、重复地做某个动作，在自闭症世界里有个名字叫"自我刺激行为"（stimming）。\n\n它不是"坏行为"，更多是孩子自我安抚的方式——帮他调节情绪、降低焦虑、表达兴奋，或者只是觉得这样做很开心。当感官过载、情绪绷不住时，转两圈、看看手指、重复同一句话，都能让世界暂时变得"可预测"。\n\n只要没有伤害到自己或别人，不必强行打断。可以给他一个安全的空间让他尽情转，转完他自然会回来。',
      sources: [
        { name: 'Autism UK - Stimming', url: 'https://www.autism.org.uk/about/behavior/stimming.aspx' }
      ]
    },
    {
      keywords: ['治好', '治愈', '康复', '能治吗', '医好'],
      answer: '"自闭症能治好吗？"——这是几乎所有家长都会问的问题。\n\n目前的研究共识是：自闭症是一种神经发育差异，不是"病"，所以也谈不上"治好"。但这不等于没有希望——\n· 早期科学干预能显著改善孩子的社交、沟通、自理能力，让孩子更从容地生活\n· 干预目标不是"看起来像普通孩子"，而是帮孩子发展出他自己的能力、减少让他困扰的部分\n· 很多自闭症人士成年后能上学、工作、独立生活，也拥有自己的朋友和情感\n\n所以更准确的说法是：自闭症可以被理解、被支持、被陪伴，但不被"治愈"。',
      sources: [
        { name: '美国CDC - 治疗', url: 'https://www.cdc.gov/ncbddd/autism/treatment.html' }
      ]
    },
    {
      keywords: ['遗传', '基因', '传给', '下一代', '生孩子'],
      answer: '会不会遗传，是很多人关心的问题。\n\n研究发现自闭症有较强的遗传成分——同卵双胞胎同患概率约60-90%，兄弟姐妹患病概率约2-18%（普通人群约1-2%）。但遗传非常复杂，不是"父母有，孩子就一定有"，更多是多个基因和环境因素共同作用。\n\n目前没有任何单一基因检测能"测出"自闭症。如果家里已经有自闭症孩子，再生下一个时遗传咨询医生可以帮你们更具体地讨论风险。',
      sources: [
        { name: 'Nature - 自闭症遗传学', url: 'https://www.nature.com' }
      ]
    },
    {
      keywords: ['感情', '有感情吗', '爱不爱', '关心'],

  function createStreamingBubble() {
    var msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML = '<img class="msg-face" src="xz-face.webp" alt="小星" onerror="this.style.display=\'none\'">' +
      '<div class="msg-bubble"><span class="stream-text"></span><span class="stream-cursor">▍</span></div>';
    chatWindow.appendChild(msg);
    var textEl = msg.querySelector('.stream-text');
    var cursor = msg.querySelector('.stream-cursor');
    var acc = '';
    return {
      msg: msg,
      append: function(delta) {
        acc += delta;
        textEl.textContent = acc;
        scrollChatBottom();
      },
      finish: function() {
        if (cursor) cursor.remove();
        return acc;
      },
      remove: function() { if (msg.parentNode) msg.parentNode.removeChild(msg); }
    };
  }

  async function callLLM(userText) {
    chatHistory.push({ role: 'user', content: userText });

    var resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory })
    });

    if (!resp.ok) {
      throw new Error('llm_' + resp.status);
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    var full = '';
    var stream = createStreamingBubble();

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });

      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line.indexOf('data:')) line = line.slice(5).trim();
        if (!line || line === '[DONE]') continue;
        try {
          var obj = JSON.parse(line);
          var delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
          if (delta) { full += delta; stream.append(delta); }
        } catch (e) { /* 非 JSON 心跳行，忽略 */ }
      }
    }
    var text = stream.finish();
    chatHistory.push({ role: 'assistant', content: full });
    if (chatHistory.length > HISTORY_LIMIT + 1) {
      chatHistory = [chatHistory[0]].concat(chatHistory.slice(-HISTORY_LIMIT));
    }
    return text;
  }

    if (/谢谢|感谢|多谢|thanks|thankyou/.test(t)) {
      return {
        answer: '不用谢呀 🌟 能帮到你，小星也很开心。\n\n记住，你愿意花时间来了解我们，这本身就是一件很温柔、很了不起的事。还有问题随时来找我，我一直在 💛',
        sources: []
      };
    }
    if (/再见|拜拜|拜|bye|goodbye|晚安|走了|下线/.test(t)) {
      return {
        answer: '再见啦，路上慢一点 🌙\n\n谢谢你今天陪我聊天。无论你在经历什么，记得小星在这里，还有很多人也愿意和你一起走。需要我的时候，随时回来 💛',
        sources: []
      };
    }
    if (/^(你好|您好|hi|hello|嗨|哈喽|halo|在吗|在么|你在吗|早|早上好|晚上好|下午好)/.test(t) ||
        t === '你好' || t === 'hi' || t === 'hello' || t === '嗨') {
      return {
        answer: '你好呀，见到你真开心 🌟\n\n我是小星。关于自闭症，有什么想了解的都可以问我——无论是孩子的某个行为，还是你心里的某个疑惑，甚至只是想找人说说心里话，都可以。\n\n今天想聊点什么呢？',
        sources: []
      };
    }
    return null;
  }

  // ====== 知识库匹配 ======
  function searchKnowledgeBase(query) {
    var q = normalizeText(query);
    if (!q) {
      return { answer: '', sources: [], noMatch: true };
    }

    var bestMatch = null;
    var bestScore = 0;
    var hitKws = [];

    knowledgeBase.forEach(function(entry) {
      var score = 0;
      var entryHits = [];
      entry.keywords.forEach(function(kwRaw) {
        var kw = normalizeText(kwRaw);
        if (kw.length < 2) return;

        if (q.indexOf(kw) >= 0) {
          score += kw.length * 2;
          entryHits.push(kw);
        } else {
          for (var i = 0; i + 2 <= kw.length; i++) {
            var seg = kw.substring(i, i + 2);
            if (q.indexOf(seg) >= 0) { score += 1; }
          }
        }
      });
      if (entryHits.length >= 2) { score += entryHits.length * 2; }

      if (score > bestScore) {
        bestScore = score;
        bestMatch = entry;
        hitKws = entryHits;
      }
    });

    if (bestMatch && bestScore >= 5) {
      return bestMatch;
    }

    return {
      answer: '嗯……这个问题小星还在学习中，暂时答不上来 🤔\n\n你可以试试换几个词再问我，比如「不说话」「叫名字没反应」「怕吵」「爱转圈」「不跟小朋友玩」「睡不好」之类的；也可以点下面的快捷话题。\n\n如果是想找身边的机构和学校，跟我说「哪里有机构」，我来给你指路 💛',
      sources: [],
      noMatch: true
    };
  }

  // ====== 本地兜底回答 ======
  function localReply(userText) {
    var intent = detectChatIntent(userText);
    if (intent) {
      addChatMsg('bot', intent.answer, intent.sources);
      return;
    }
    var result = searchKnowledgeBase(userText);
    if (result.noMatch) {
      addChatMsg('bot', result.answer);
    } else {
      addChatMsg('bot', result.answer, result.sources);
    }
  }

  // ====== 智能追问推荐 ======
  function suggestFollowUps(q) {
    var t = q || '';
    function has() { for (var i = 0; i < arguments.length; i++) { if (t.indexOf(arguments[i]) >= 0) return true; } return false; }
    if (has('不说话','语言','开口','说话晚')) return ['叫他名字总是没反应','孩子动不动就崩溃大哭','自闭症能治好吗？'];
    if (has('名字','反应','不理','听不见')) return ['为什么不看别人的眼睛','他不跟小朋友玩怎么办','感官世界是什么体验？'];
    if (has('崩溃','大哭','发脾气','情绪','闹')) return ['孩子崩溃时我能做什么','他自己也难过吗','如何安抚情绪？'];
    if (has('玩','朋友','社交','不合群','孤独')) return ['怎么帮他交到朋友','上学后被欺负怎么办','帮帮小星怎么玩？'];
    if (has('学校','机构','支持','资源','哪里','城市','省份')) return ['「身边的支持」怎么筛选？','找不到我们城市怎么办？','大龄孩子怎么办？'];
    if (has('治好','治愈','康复','训练','干预')) return ['早期干预怎么做','去哪里找康复机构','家长该怎么调整心态'];
    if (has('欺负','霸凌','被嘲笑')) return ['怎么和老师沟通','如何教孩子保护自己','怎么帮他建立自信'];
    if (has('秘密','感官','拼图','留言','帮帮小星','走进小星')) return ['小星的秘密有几个？','拼图碎片怎么收集？','怎么给小星留言？'];
    if (has('睡觉','睡眠','夜醒')) return ['睡前可以做什么准备','感官敏感影响睡觉吗','白天感官世界怎么玩'];
    return ['自闭症能治好吗？','身边的支持怎么用？','帮帮小星怎么玩？'];
  }

  function addFollowChips(q, msgEl) {
    var chips = suggestFollowUps(q);
    if (!chips || !chips.length) return;
    var row = document.createElement('div');
    row.className = 'msg-follow';
    chips.forEach(function(c) {
      var b = document.createElement('button');
      b.className = 'follow-chip';
      b.textContent = c;
      b.addEventListener('click', function() {
        row.parentNode.removeChild(row);
        userSend(c);
      });
      row.appendChild(b);
    });
    if (msgEl && msgEl.parentNode) msgEl.parentNode.insertBefore(row, msgEl.nextSibling);
    else chatWindow.appendChild(row);
    scrollChatBottom();
  }

  function botReply(userText) {
    showTyping();
    if (llmFailedOnce) {
      setTimeout(function() {
        removeTyping(); localReply(userText);
        var last = chatWindow.querySelector('.msg.bot:last-child');
        addFollowChips(userText, last);
      }, 600 + Math.random() * 500);
      return;
    }
    callLLM(userText).then(function(text) {
      removeTyping();
      var last = chatWindow.querySelector('.msg.bot:last-child');
      addFollowChips(userText, last);
    }).catch(function() {
      removeTyping();
      llmFailedOnce = true;
      setLocalModeBadge();
      var half = chatWindow.querySelector('.stream-cursor');
      if (half && half.closest('.msg')) half.closest('.msg').remove();
      localReply(userText);
      var last = chatWindow.querySelector('.msg.bot:last-child');
      addFollowChips(userText, last);
    });
  }

  function userSend(text) {
    text = (text || '').trim();
    if (!text) return;
    addChatMsg('user', text);
    chatInput.value = '';
    autoResize();
    botReply(text);
  }

  chatSend.addEventListener('click', function() { userSend(chatInput.value); });
  // textarea：Enter 发送，Shift+Enter 换行
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      userSend(chatInput.value);
    }
  });

  // 快捷问题
  chatQuickQuestions.forEach(function(q) {
    var chip = document.createElement('button');
    chip.className = 'chat-chip';
    chip.textContent = q;
    chip.addEventListener('click', function() { userSend(q); });
    chatQuick.appendChild(chip);
  });

  // 初始欢迎语
  addChatMsg('bot',
    '你好呀，我是小星 🌟\n\n你是不是也有很多关于我们这些"星星的孩子"的疑问？为什么我不看眼睛？为什么我会捂住耳朵？……把你想知道的问出来吧，我会用自己的方式认真回答你。\n\n点下面的小标签，或者直接打字都可以哦～');

  // ====== 会话重置 ======
  document.getElementById('chatReset').addEventListener('click', function() {
    chatWindow.innerHTML = '';
    chatHistory = [{ role: 'system', content: SYSTEM_PROMPT }];
    llmFailedOnce = false;
    setAIOnlineBadge();
    addChatMsg('bot',
      '我们重新开始啦 🌟\n\n刚才的话我都忘掉了，你可以问新的问题。也可以告诉我怎么称呼你、你的孩子多大了，后面的聊天里我会记得的～');
  });

  // ====== 在线状态徽标 ======
  function setAIOnlineBadge() {
    var dot = document.getElementById('aiModeDot');
    var txt = document.getElementById('aiModeText');
    if (dot) dot.className = 'chat-dot-online';
    if (txt) txt.textContent = 'AI 大模型在线，随时可以问我哦';
  }
  function setLocalModeBadge() {
    var dot = document.getElementById('aiModeDot');
    var txt = document.getElementById('aiModeText');
    if (dot) dot.className = 'chat-dot-off';
    if (txt) txt.textContent = '本地科普模式 · 配置API Key后可连接大模型';
  }
  fetch('/api/status').then(function(r) { return r.json(); }).then(function(s) {
    if (!s || !s.llm) setLocalModeBadge();
  }).catch(function() { setLocalModeBadge(); });

  // ====== 返回小星的家：淡出后直达 Hub ======
  (function addFadeIn() {
    var st = document.createElement('style');
    st.textContent = '@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}html,body{animation:pageFadeIn .5s ease both}';
    document.head.appendChild(st);
  })();
  var backBtn = document.querySelector('.back-btn');
  if (backBtn) {
    backBtn.setAttribute('href', 'index.html#hub');
    backBtn.addEventListener('click', function(e) {
      e.preventDefault();
      document.body.style.animation = 'none';
      document.body.style.transition = 'opacity .45s ease';
      document.body.style.opacity = '0';
      setTimeout(function() { location.href = 'index.html#hub'; }, 450);
    });
  }
})();
</script>
