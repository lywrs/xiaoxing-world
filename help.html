<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>帮帮小星</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-title: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  --bg: #F7F0EA;
  --text: #5B5550;
  --text-light: #8A8278;
  --green: #6BAF7A;
  --red: #E85D5D;
  --warm: #E8C9A3;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg) url("背景.jpg") no-repeat center center / cover fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.page {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px 16px 60px;
}
/* 模式选择入口页：放开宽度，让两张卡片整体更大 */
body:not([data-mode]) .page { max-width: 1080px; }

/* ====== 标题 ====== */
.header { text-align: center; margin-bottom: 16px; }
.header-title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.header-face {
  width: 62px;
  flex: none;
  object-fit: contain;
  filter: drop-shadow(0 3px 8px rgba(90,70,52,0.16));
  animation: faceFloat 3s ease-in-out infinite;
}
.face-r { display: inline-flex; flex: none; transform: scaleX(-1); }
@keyframes faceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (max-width: 480px) {
  .header-face { width: 46px; }
  .header-title-row { gap: 10px; }
}
.page-title { font-family: var(--font-title); font-size: 1.6rem; margin-bottom: 4px; }
.page-subtitle { font-size: 0.9rem; color: var(--text-light); }

/* ====== 场景进度条 ====== */
.scenario-progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
.sp-dot {
  width: 28px; height: 6px;
  border-radius: 3px;
  background: rgba(91,85,80,0.12);
  transition: all 0.3s;
}
.sp-dot.active { background: var(--warm); }
.sp-dot.done { background: var(--green); }
.sp-text {
  font-size: 0.78rem;
  color: var(--text-light);
  margin-left: 4px;
}

/* ====== 当前场景卡片（拖放目标） ====== */
.scenario-card {
  border-radius: 18px;
  padding: 24px 20px;
  text-align: center;
  border: 3px dashed rgba(91,85,80,0.12);
  background: rgba(255,255,255,0.5);
  transition: all 0.25s;
  position: relative;
  margin-bottom: 20px;
  min-height: 130px;
}
.scenario-card.drop-hover {
  border-color: var(--warm);
  background: rgba(232,201,163,0.15);
  border-style: solid;
  transform: scale(1.02);
  box-shadow: 0 6px 20px rgba(232,201,163,0.25);
}
.scenario-card.done {
  border-color: var(--green);
  border-style: solid;
  background: rgba(107,175,122,0.06);
}

.sc-icon { font-size: 2.2rem; margin-bottom: 6px; }
.sc-title { font-family: var(--font-title); font-size: 1.1rem; margin-bottom: 4px; }
.sc-desc { font-size: 0.82rem; color: var(--text-light); }

/* 场景插图：加载成功才显示，失败自动回退到 emoji 图标 */
.sc-img {
  display: none;
  width: calc(100% + 40px);        /* 抵消卡片左右 padding，铺满整卡 */
  max-width: none;
  margin: -6px -20px 14px;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(91, 85, 80, 0.14);
}

/* 已匹配行为 */
.sc-matched {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sc-matched-item {
  font-size: 0.75rem;
  color: var(--green);
  background: rgba(107,175,122,0.1);
  border-radius: 8px;
  padding: 6px 10px;
  line-height: 1.4;
  animation: fadeSlideUp 0.3s ease;
}

.sc-matched-count {
  font-size: 0.72rem;
  color: var(--text-light);
  margin-top: 8px;
}

/* ====== 行为卡片 ====== */
.behavior-section-label {
  font-family: var(--font-title);
  font-size: 0.85rem;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 10px;
}

.behavior-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}

.behavior {
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 0.85rem;
  line-height: 1.5;
  cursor: grab;
  border: 2px solid rgba(91,85,80,0.08);
  background: rgba(255,255,255,0.7);
  transition: opacity 0.2s;
  touch-action: none;
  position: relative;
}
.behavior:active { cursor: grabbing; }
.behavior.dragging { opacity: 0.25; }
.behavior.clone {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(91,85,80,0.2);
  opacity: 0.95;
  transform: scale(1.05);
}
.behavior.matched { display: none; }
.behavior.wrong-flash {
  animation: shake 0.4s ease;
  border-color: var(--red);
  background: rgba(232,93,93,0.08);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ====== 反馈气泡 ====== */
.feedback {
  margin-top: 14px;
  min-height: 44px;
  display: none;
}
.feedback.show { display: block; animation: fadeSlideUp 0.3s ease; }
.feedback-bubble {
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 0.82rem;
  line-height: 1.6;
  max-width: 320px;
  margin: 0 auto;
  text-align: center;
}
.feedback-bubble.correct {
  background: rgba(107,175,122,0.12);
  border: 1px solid rgba(107,175,122,0.25);
  color: #4A8B5A;
}
.feedback-bubble.wrong {
  background: rgba(232,93,93,0.08);
  border: 1px solid rgba(232,93,93,0.2);
  color: #C94444;
}

/* ====== 场景切换动画 ====== */
.scenario-fade-out {
  animation: fadeOut 0.3s ease forwards;
}
.scenario-fade-in {
  animation: fadeInUp 0.4s ease;
}

@keyframes fadeOut {
  to { opacity: 0; transform: translateY(-10px); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ====== 感悟区 ====== */
.reflection {
  max-width: 500px;
  margin: 28px auto 0;
  display: none;
  animation: fadeInUp 0.5s ease;
}
.reflection.show { display: block; }

.reflection-header { text-align: center; margin-bottom: 14px; }
.reflection-title { font-family: var(--font-title); font-size: 1.15rem; }
.reflection-guide { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }

.reflection-textarea {
  width: 100%;
  min-height: 100px;
  border-radius: 14px;
  border: 2px solid rgba(91,85,80,0.1);
  background: rgba(255,255,255,0.6);
  padding: 14px;
  font-size: 0.88rem;
  font-family: var(--font-body);
  color: var(--text);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.6;
}
.reflection-textarea:focus { border-color: var(--warm); }

.char-count {
  text-align: right;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 4px;
}

.generate-btn {
  display: block;
  width: 100%;
  font-family: var(--font-title);
  font-size: 1rem;
  padding: 14px;
  border: none;
  border-radius: 40px;
  background: #ccc;
  color: #999;
  cursor: not-allowed;
  margin-top: 12px;
  transition: all 0.3s;
}
.generate-btn.active {
  background: linear-gradient(135deg, var(--warm), #D4A574);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(232,201,163,0.3);
}
.generate-btn.active:active { transform: scale(0.97); }

/* ====== 星光树弹窗 ====== */
.tree-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(10,5,25,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
}
.tree-overlay.show { display: flex; animation: fadeIn 0.4s ease; }

.tree-container {
  width: 100%;
  max-width: 420px;
  background: linear-gradient(180deg, #1a1033 0%, #2d1b4e 40%, #1a1033 100%);
  border-radius: 20px;
  padding: 24px 16px 20px;
  position: relative;
  overflow: hidden;
  animation: slideUp 0.5s ease;
}

.tree-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.1);
  color: #ccc;
  font-size: 0.9rem;
  cursor: pointer;
  z-index: 20;
}

.tree-title { text-align: center; color: #FFD700; font-family: var(--font-title); font-size: 1.2rem; margin-bottom: 6px; }
.tree-subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.78rem; margin-bottom: 18px; }

.tree-scene { position: relative; width: 100%; height: 280px; overflow: hidden; }
.tree-trunk {
  position: absolute; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 60px;
  background: linear-gradient(180deg, #5A3D2A, #3A2818);
  border-radius: 3px 3px 0 0;
}
.tree-branches {
  position: absolute; bottom: 70px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 120px solid rgba(76,175,80,0.08);
}
.tree-glow {
  position: absolute; bottom: 60px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 14px; height: 14px;
  background: radial-gradient(circle, #FFE066 0%, #FFB733 70%);
  border-radius: 50%;
  box-shadow: 0 0 8px 2px rgba(255,215,0,0.4);
  cursor: pointer;
  transition: transform 0.2s;
  animation: twinkle 2s ease-in-out infinite;
}
.star:hover, .star:active { transform: scale(1.4); }
.star.mine {
  width: 18px; height: 18px;
  border: 2px solid #FF6B6B;
  box-shadow: 0 0 12px 3px rgba(255,107,107,0.4);
}

@keyframes twinkle { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

.star-bubble {
  position: absolute;
  max-width: 180px;
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.78rem;
  line-height: 1.5;
  color: var(--text);
  z-index: 30;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.star-bubble.show { display: block; }
.star-bubble.mine { border: 2px solid #FF6B6B; }

.tree-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.tree-btn {
  width: 100%;
  font-family: var(--font-title);
  font-size: 0.9rem;
  padding: 12px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: transform 0.2s;
}
.tree-btn:active { transform: scale(0.97); }
.tree-btn.share { background: rgba(255,255,255,0.12); color: #FFD700; border: 1px solid rgba(255,215,0,0.3); }
.tree-btn.back { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }

.back-link {
  position: fixed;
  top: 18px;
  left: 16px;
  z-index: 100;
  padding: 10px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, #E8C9A3 0%, #F0D5C0 100%);
  color: #4A3A28;
  font-family: var(--font-title);
  font-size: 0.9rem;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(232, 201, 163, 0.4);
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* ====== 如果我是小星 · 情境模拟（热身） ====== */
.empathy-section {
  max-width: 600px;
  margin: 4px auto 30px;
}
.empathy-header { text-align: center; margin-bottom: 14px; }
.empathy-title { font-family: var(--font-title); font-size: 1.45rem; }
.empathy-guide { font-size: 0.95rem; color: var(--text-light); margin-top: 4px; }

.empathy-card {
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(232,201,163,0.4);
  border-radius: 20px;
  padding: 26px 24px;
  box-shadow: 0 4px 18px rgba(91,85,80,0.08);
}
.empathy-card.ep-flip { animation: epFlip 0.5s ease; }
@keyframes epFlip {
  0% { transform: rotateY(0); }
  50% { transform: rotateY(5deg) scale(1.015); }
  100% { transform: rotateY(0); }
}

.ep-tag {
  display: inline-block;
  font-size: 0.85rem;
  color: #B08650;
  border: 1.5px solid var(--warm);
  border-radius: 20px;
  padding: 4px 14px;
  margin-bottom: 12px;
  background: rgba(232,201,163,0.12);
  letter-spacing: 1px;
}
.ep-scene {
  font-size: 1.04rem;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 18px;
}

/* 场景图 + 文字：大图在上（全宽），文字描述在图片下方 */
.ep-top {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 18px;
}
.ep-media {
  width: 100%;
  max-width: 100%;
  display: flex;
  flex-direction: column;
}
.ep-media img {
  width: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 14px;
  border: 2px solid rgba(232,201,163,0.5);
  box-shadow: 0 0 26px rgba(232,201,163,0.55), 0 8px 20px rgba(91,85,80,0.14);
  display: block;
  background: rgba(232,201,163,0.10);
}
.ep-caption {
  margin-top: 10px;
  font-size: 0.85rem;
  color: var(--text-light);
  text-align: center;
  line-height: 1.5;
}
.ep-body {
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.ep-body .ep-tag { margin-bottom: 10px; }
.ep-body .ep-scene { margin-bottom: 0; font-size: 1.15rem; line-height: 1.7; }
.ep-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.ep-btn {
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 16px 10px;
  border-radius: 14px;
  cursor: pointer;
  line-height: 1.5;
  transition: all 0.25s;
}
.ep-btn:active { transform: scale(0.96); }
.ep-btn.go {
  background: linear-gradient(135deg, var(--warm), #D4A574);
  color: #fff;
  border: none;
  box-shadow: 0 4px 14px rgba(212,165,116,0.3);
}
.ep-btn.nope {
  background: rgba(91,85,80,0.07);
  color: var(--text-light);
  border: 1.5px solid rgba(91,85,80,0.12);
}
.ep-choices.answered .ep-btn { cursor: default; opacity: 0.45; transform: none; }
.ep-choices.answered .ep-btn.picked { opacity: 1; box-shadow: 0 0 0 2px var(--warm) inset; }

/* 小星真实想法：展开式过渡 */
.ep-truth {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, opacity 0.5s ease;
}
.ep-truth.show { max-height: 760px; opacity: 1; }
.ep-truth-inner {
  margin-top: 18px;
  border-left: 3px solid var(--warm);
  background: rgba(232,201,163,0.13);
  border-radius: 0 14px 14px 0;
  padding: 16px 18px;
}
.ep-truth-head {
  font-family: var(--font-title);
  font-size: 0.92rem;
  color: #B08650;
  margin-bottom: 8px;
}
.ep-truth-text { font-size: 1.05rem; line-height: 1.8; color: var(--text); }

.ep-next {
  display: block;
  width: 100%;
  margin-top: 18px;
  font-family: var(--font-title);
  font-size: 1.05rem;
  padding: 14px;
  border: 2px solid var(--warm);
  border-radius: 30px;
  background: rgba(255,255,255,0.8);
  color: #B08650;
  cursor: pointer;
  transition: all 0.25s;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
}
.ep-next.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
  transition: all 0.4s ease 0.3s;
}
.ep-next:active { transform: scale(0.97); }

/* 情境底部导航：返回上一个情境 + 下一个情境并排 */
.ep-nav {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}
.ep-nav .ep-next { width: auto; margin-top: 0; flex: 1.4; }
.ep-prev {
  flex: 1;
  font-family: var(--font-title);
  font-size: 1.05rem;
  padding: 14px;
  border: 2px dashed rgba(176,134,80,0.45);
  border-radius: 30px;
  background: rgba(255,255,255,0.55);
  color: #B08650;
  cursor: pointer;
  transition: all 0.25s;
}
.ep-prev:active { transform: scale(0.97); }
.ep-prev:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.ep-prev:disabled:active { transform: none; }

.ep-progress { text-align: center; font-size: 0.85rem; color: var(--text-light); margin-top: 14px; }

/* 手机端（窄屏）：卡片内边距与字号适度回调，保证一屏内容舒适 */
@media (max-width: 560px) {
  .empathy-section { max-width: 100%; }
  .empathy-card { padding: 18px 16px; border-radius: 18px; }
  .empathy-title { font-size: 1.3rem; }
  .empathy-guide { font-size: 0.88rem; }
  .ep-body .ep-scene { font-size: 1.05rem; line-height: 1.65; }
  .ep-caption { font-size: 0.8rem; }
  .ep-btn { font-size: 0.92rem; padding: 14px 8px; }
  .ep-truth-text { font-size: 0.98rem; line-height: 1.75; }
  .ep-next { font-size: 1rem; padding: 13px; }
  .ep-prev { font-size: 1rem; padding: 13px; }
  .ep-media img { border-radius: 12px; }
}

/* 完成庆祝卡 */
.ep-done { text-align: center; padding: 12px 0 6px; animation: fadeSlideUp 0.5s ease; }
.ep-done-icon { font-size: 2.6rem; margin-bottom: 8px; }
.ep-done-title { font-family: var(--font-title); font-size: 1.12rem; margin-bottom: 8px; }
.ep-done-text { font-size: 0.9rem; color: var(--text-light); line-height: 1.7; margin-bottom: 18px; }
.ep-done-text b { color: #B08650; }
.ep-restart {
  font-family: var(--font-title);
  font-size: 0.9rem;
  padding: 11px 28px;
  border: 2px solid var(--warm);
  border-radius: 30px;
  background: rgba(255,255,255,0.8);
  color: #B08650;
  cursor: pointer;
  transition: all 0.25s;
}
.ep-restart:active { transform: scale(0.96); }

/* ====== 模式选择（两种视角） ====== */
.mode-select { max-width: 980px; margin: 56px auto 18px; padding: 0 24px; }
.mode-header { text-align: center; margin-bottom: 32px; }
.mode-title { font-family: var(--font-title); font-size: 1.9rem; }
.mode-guide { font-size: 1.05rem; color: var(--text-light); margin-top: 8px; }
.mode-cards { display: grid; grid-template-columns: 1fr; gap: 40px; }
.mode-card {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(232,201,163,0.5);
  border-radius: 26px;
  padding: 48px 32px;
  cursor: pointer;
  font-family: var(--font-body);
  transition: all 0.25s;
  box-shadow: 0 4px 14px rgba(91,85,80,0.08);
  min-height: 300px;
  justify-content: center;
}
.mode-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(232,201,163,0.35); }
.mode-card:active { transform: scale(0.98); }
.mode-img {
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 12px;
  margin-bottom: 18px;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(91,85,80,0.12);
  display: block;
}
.mode-icon { font-size: 2.2rem; flex-shrink: 0; margin-bottom: 6px; }
.mode-name { font-family: var(--font-title); font-size: 1.55rem; color: var(--text); margin-bottom: 10px; }
.mode-desc { font-size: 1.05rem; color: var(--text-light); line-height: 1.6; }
.mode-card .mode-arrow { margin-top: 14px; color: var(--warm); font-size: 1.5rem; }

.mode-back {
  display: block;
  width: fit-content;
  margin: 20px auto 0;
  font-size: 1rem;
  color: #A08768;
  background: rgba(255,255,255,0.65);

  cursor: pointer;
  font-family: var(--font-body);
  transition: all 0.2s;
}
.mode-back:hover { color: #B08650; border-color: rgba(176,134,80,0.6); }

/* 模式显隐：默认只显示模式选择 */
body:not([data-mode="empathy"]) .empathy-section { display: none; }
body:not([data-mode="friend"]) .scenario-progress,

@media (min-width: 640px) {

}
@media (max-width: 639px) {
  .mode-cards { grid-template-columns: 1fr; }
  .mode-icon { font-size: 2rem; }

  .mode-card { padding: 22px 18px; min-height: auto; }

}

<body>

    <div class="scenario-progress" id="scenarioProgress">

<script>
(function() {
  // ====== 数据 ======
  var scenarios = [
    {
      icon: '🏫', title: '教室声音太吵', desc: '小星捂住耳朵低头',
      img: '教室.jpg',
      behaviors: [
        { text: '帮他关小窗户，减少噪音来源', correct: true },
        { text: '写一张纸条问他"需要帮忙吗"', correct: true },
        { text: '拍他肩膀大声问他"你怎么了"', correct: false },
        { text: '跟他说"别这么敏感，忍一忍就好"', correct: false }
      ]
    },
    {
      icon: '🌳', title: '超市感官不适', desc: '小星想要离开',
      img: '超市.jpg',
      behaviors: [
        { text: '尽快带他离开嘈杂环境', correct: true },
        { text: '尊重他的离开意愿，不强迫', correct: true },
        { text: '劝说他要勇敢一点，继续逛完', correct: false },
        { text: '当众指责他不懂事、不听话', correct: false }
      ]
    },
    {
      icon: '💬', title: '同学想做朋友', desc: '他不知道如何回应',
      img: '社交.jpg',
      behaviors: [
        { text: '直接用简单的语言问他："可以一起玩吗？"', correct: true },
        { text: '坐在他旁边安静地陪伴，等他先开口', correct: true },
        { text: '替他回答："他不想和你玩"', correct: false },
        { text: '批评他："别人和你说话要回答"', correct: false }
      ]
    },
    {
      icon: '🌊', title: '情绪崩溃', desc: '大哭撞头',
      img: '商场.jpg',
      behaviors: [
        { text: '保持安静，不围观，给他空间', correct: true },
        { text: '悄悄移开周围的硬物，确保安全', correct: true },
        { text: '不停追问"你怎么了""哪里不舒服"', correct: false },
        { text: '大声制止："不许这样！"', correct: false }
      ]
    }
  ];

  var correctFeedbacks = [
    '如果你这样对我，我会觉得被理解了。',
    '谢谢你用我能接受的方式靠近我。',
    '这句话让我觉得，世界好像没那么吵了。',
    '你做的这件事，让我感到很安全。'
  ];
  var wrongFeedbacks = [
    '再想想……如果是你，你会希望别人怎么做呢？',
    '这个方式可能会让我更紧张哦～',
    '试着换个角度想一想？',
    '小星需要的不是鼓励，是理解和空间。'
  ];
  var presetReflections = [
    '原来安静地陪着他，就是最好的支持。',
    '我以后不会再盯着特殊的孩子看了。',
    '小星的世界很不容易，但他很努力。',
    '不说话，有时候是最好的说话。',
    '理解比同情更需要勇气。',
    '每个孩子都有自己的频率，找到它就能靠近。',
    '小星不是不合群，他只是在用自己的方式感受世界。',
    '我学会了不急着纠正，先试着理解。',
    '原来捂耳朵不是不听，是太吵了。',
    '陪伴不需要语言，一个安全的距离就够了。',
    '他不是不想交朋友，只是不知道怎么开口。',
    '崩溃不是脾气差，是太满了，装不下了。',
    '有时候最好的帮助，是给空间和时间。',
    '重复不是固执，是寻找安全感。',
    '我愿意做那个安静坐在他身边的人。'
  ];

  // ====== 状态 ======
  var currentScenario = 0;
  var matchedInScenario = 0;
  var behaviorMatched = []; // 当前场景的行为匹配状态

  // ====== DOM ======
  var scenarioCard = document.getElementById('scenarioCard');
  var behaviorGrid = document.getElementById('behaviorGrid');
  var behaviorLabel = document.getElementById('behaviorLabel');
  var feedback = document.getElementById('feedback');
  var feedbackBubble = document.getElementById('feedbackBubble');
  var scenarioProgress = document.getElementById('scenarioProgress');
  var spText = document.getElementById('spText');
  var gameArea = document.getElementById('gameArea');
  var reflection = document.getElementById('reflection');
  var reflectText = document.getElementById('reflectText');
  var charCount = document.getElementById('charCount');
  var generateBtn = document.getElementById('generateBtn');
  var fmPrevBtn = document.getElementById('fmPrev');
  var treeOverlay = document.getElementById('treeOverlay');
  var treeScene = document.getElementById('treeScene');
  var starBubble = document.getElementById('starBubble');
  var treeClose = document.getElementById('treeClose');
  var shareBtn = document.getElementById('shareBtn');
  var treeBackBtn = document.getElementById('treeBackBtn');

  // ====== 渲染当前场景 ======
  function renderScenario() {
    var s = scenarios[currentScenario];
    behaviorMatched = s.behaviors.map(function() { return false; });
    matchedInScenario = 0;

    scenarioCard.classList.add('scenario-fade-in');
    setTimeout(function() { scenarioCard.classList.remove('scenario-fade-in'); }, 400);

    scenarioCard.className = 'scenario-card';
    scenarioCard.innerHTML =
      '<img class="sc-img" id="scImg" alt="">' +
      '<div class="sc-icon" id="scIcon">' + s.icon + '</div>' +
      '<div class="sc-title">' + s.title + '</div>' +
      '<div class="sc-desc">' + s.desc + '</div>' +
      '<div class="sc-matched" id="scMatched"></div>' +
      '<div class="sc-matched-count" id="scMatchedCount">已匹配 0/2</div>';

    // 场景插图：加载成功显示图片并隐藏 emoji，失败则回退（不报错）
    var scImg = document.getElementById('scImg');
    var scIcon = document.getElementById('scIcon');
    scImg.style.display = 'none';
    scIcon.style.display = 'block';
    if (s.img) {
      scImg.onload = function() {
        scImg.style.display = 'block';
        scIcon.style.display = 'none';
      };
      scImg.onerror = function() {
        scImg.style.display = 'none';
        scIcon.style.display = 'block';
      };
      scImg.src = s.img;
    }

    behaviorLabel.textContent = '👇 长按卡片拖到上方的情景';
    renderBehaviors();
    feedback.classList.remove('show');
    updateProgress();
    if (fmPrevBtn) fmPrevBtn.disabled = currentScenario === 0;
  }

  // 返回上一个情境（朋友玩法）
  if (fmPrevBtn) fmPrevBtn.addEventListener('click', function() {
    if (currentScenario <= 0) return;
    currentScenario--;
    renderScenario();
    reflection.classList.remove('show');
    setTimeout(function() { scenarioCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  });

  function renderBehaviors() {
    var s = scenarios[currentScenario];
    behaviorGrid.innerHTML = '';

    // 打乱顺序
    var indices = [0, 1, 2, 3];
    indices.sort(function() { return Math.random() - 0.5; });

    indices.forEach(function(bi) {
      var b = s.behaviors[bi];
      var div = document.createElement('div');
      div.className = 'behavior';
      div.textContent = b.text;
      div.dataset.bIndex = bi;
      behaviorGrid.appendChild(div);
      attachDrag(div, bi);
    });
  }

  function updateProgress() {
    var dots = scenarioProgress.querySelectorAll('.sp-dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.remove('active', 'done');
      if (i < currentScenario) dots[i].classList.add('done');
      else if (i === currentScenario) dots[i].classList.add('active');
    }
    spText.textContent = '场景 ' + (currentScenario + 1) + '/4';
  }

  // ====== 拖拽系统 ======
  function attachDrag(el, behaviorIndex) {
    var clone = null;
    var dragging = false;
    var offsetX = 0, offsetY = 0;

    el.addEventListener('pointerdown', function(e) {
      if (behaviorMatched[behaviorIndex]) return;
      e.preventDefault();

      var rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;

      clone = el.cloneNode(true);
      clone.classList.add('clone');
      clone.style.left = rect.left + 'px';
      clone.style.top = rect.top + 'px';
      clone.style.width = rect.width + 'px';
      document.body.appendChild(clone);

      el.classList.add('dragging');
      dragging = true;
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', function(e) {
      if (!dragging || !clone) return;
      e.preventDefault();

      clone.style.left = (e.clientX - offsetX) + 'px';
      clone.style.top = (e.clientY - offsetY) + 'px';

      // 检测悬停
      clone.style.pointerEvents = 'none';
      var target = document.elementFromPoint(e.clientX, e.clientY);
      clone.style.pointerEvents = '';

      scenarioCard.classList.remove('drop-hover');
      if (target) {
        var sc = target.closest('.scenario-card');
        if (sc && !sc.classList.contains('done')) {
          sc.classList.add('drop-hover');
        }
      }
    });

    el.addEventListener('pointerup', function(e) {
      if (!dragging || !clone) return;
      e.preventDefault();

      clone.style.pointerEvents = 'none';
      var target = document.elementFromPoint(e.clientX, e.clientY);
      clone.style.pointerEvents = '';

      scenarioCard.classList.remove('drop-hover');

      var sc = target ? target.closest('.scenario-card') : null;
      if (sc && !sc.classList.contains('done')) {
        handleDrop(behaviorIndex, el);
      }

      if (clone) {
        clone.style.transition = 'opacity 0.2s';
        clone.style.opacity = '0';
        var c = clone;
        setTimeout(function() { if (c.parentNode) c.parentNode.removeChild(c); }, 200);
        clone = null;
      }

      el.classList.remove('dragging');
      dragging = false;
    });

    el.addEventListener('pointercancel', function() {
      if (clone) {
        var c = clone;
        setTimeout(function() { if (c.parentNode) c.parentNode.removeChild(c); }, 200);
        clone = null;
      }
      el.classList.remove('dragging');
      dragging = false;
    });
  }

  // ====== 处理放置 ======
  function handleDrop(behaviorIndex, el) {
    var b = scenarios[currentScenario].behaviors[behaviorIndex];

    if (b.correct) {
      // 正确
      behaviorMatched[behaviorIndex] = true;
      el.classList.add('matched');
      matchedInScenario++;
      showFeedback(true);
      updateMatchedDisplay();

      if (matchedInScenario >= 2) {
        // 场景完成
        scenarioCard.classList.add('done');
        feedback.classList.remove('show');

        setTimeout(function() {
          if (currentScenario < 3) {
            // 进入下一个场景
            gameArea.classList.add('scenario-fade-out');
            setTimeout(function() {
              gameArea.classList.remove('scenario-fade-out');
              currentScenario++;
              renderScenario();
            }, 300);
          } else {
            // 全部完成
            behaviorLabel.textContent = '🎉 全部场景完成！';
            behaviorGrid.innerHTML = '';
            unlockReflection();
          }
        }, 1000);
      }
    } else {
      // 错误
      el.classList.add('wrong-flash');
      showFeedback(false);
      setTimeout(function() { el.classList.remove('wrong-flash'); }, 500);
    }
  }

  function updateMatchedDisplay() {
    var s = scenarios[currentScenario];
    var container = document.getElementById('scMatched');
    var countEl = document.getElementById('scMatchedCount');
    if (!container || !countEl) return;

    container.innerHTML = '';
    for (var i = 0; i < s.behaviors.length; i++) {
      if (behaviorMatched[i] && s.behaviors[i].correct) {
        var item = document.createElement('div');
        item.className = 'sc-matched-item';
        item.textContent = '✓ ' + s.behaviors[i].text;
        container.appendChild(item);
      }
    }
    countEl.textContent = '已匹配 ' + matchedInScenario + '/2';
  }

  // ====== 反馈 ======
  function showFeedback(isCorrect) {
    var pool = isCorrect ? correctFeedbacks : wrongFeedbacks;
    var text = pool[Math.floor(Math.random() * pool.length)];
    feedbackBubble.className = 'feedback-bubble ' + (isCorrect ? 'correct' : 'wrong');
    feedbackBubble.textContent = text;
    feedback.classList.add('show');
    if (isCorrect) {
      setTimeout(function() { feedback.classList.remove('show'); }, 2000);
    }
  }

  // ====== 感悟区 ======
  function unlockReflection() {
    reflection.classList.add('show');
    setTimeout(function() {
      reflection.scrollIntoView({ behavior: 'smooth' });
    }, 200);
  }

  reflectText.addEventListener('input', function() {
    var len = reflectText.value.length;
    charCount.textContent = len;
    if (len >= 20) {
      generateBtn.classList.add('active');
    } else {
      generateBtn.classList.remove('active');
    }
  });

  generateBtn.addEventListener('click', function() {
    if (!generateBtn.classList.contains('active')) return;
    showStarTree();
  });

  // ====== 星光树 ======
  function showStarTree() {
    treeOverlay.classList.add('show');
    renderStarTree();
  }

  function renderStarTree() {
    var oldStars = treeScene.querySelectorAll('.star');
    oldStars.forEach(function(s) { s.remove(); });

    var userText = reflectText.value.trim();
    var allReflections = presetReflections.slice();
    if (userText) allReflections.unshift(userText);

    var userStars = Math.max(5, Math.min(20, Math.floor(userText.length / 10) + 5));
    var indices = [];
    for (var i = 0; i < allReflections.length; i++) indices.push(i);
    indices.sort(function() { return Math.random() - 0.5; });
    var count = Math.min(userStars, allReflections.length);
    var selected = [];
    for (var j = 0; j < count; j++) {
      selected.push({
        text: allReflections[indices[j]],
        isMine: indices[j] === 0 && userText.length > 0
      });
    }

    selected.forEach(function(item, k) {
      var star = document.createElement('div');
      star.className = 'star' + (item.isMine ? ' mine' : '');
      var angle = (k / count) * Math.PI * 2 + Math.random() * 0.5;
      var cx = 50 + Math.cos(angle - Math.PI/2) * (20 + Math.random() * 15);
      var cy = 30 + Math.sin(angle - Math.PI/2) * (15 + Math.random() * 20);
      star.style.left = Math.max(5, Math.min(85, cx)) + '%';
      star.style.top = Math.max(5, Math.min(70, cy)) + '%';
      star.style.animationDelay = (Math.random() * 2) + 's';
      star.dataset.text = item.text;
      star.dataset.isMine = item.isMine ? '1' : '0';
      star.addEventListener('click', function(e) {
        e.stopPropagation();
        showStarBubble(this);
      });
      treeScene.appendChild(star);
    });
  }

  function showStarBubble(star) {
    var text = star.dataset.text;
    var isMine = star.dataset.isMine === '1';
    var rect = star.getBoundingClientRect();
    var sceneRect = treeScene.getBoundingClientRect();

    starBubble.textContent = text;
    starBubble.className = 'star-bubble' + (isMine ? ' mine' : '');
    starBubble.classList.add('show');

    var left = rect.left - sceneRect.left + rect.width / 2;
    var top = rect.top - sceneRect.top - 10;
    starBubble.style.left = Math.max(10, Math.min(left - 90, sceneRect.width - 190)) + 'px';
    starBubble.style.top = Math.max(10, top - 60) + 'px';
  }

  treeScene.addEventListener('click', function() {
    starBubble.classList.remove('show');
  });

  treeClose.addEventListener('click', function() {
    treeOverlay.classList.remove('show');
  });

  shareBtn.addEventListener('click', function() {
    var userText = reflectText.value.trim();
    var shareText = userText || '我了解了小星的故事，一起来感受自闭症孩子的世界吧。';
    if (navigator.share) {
      navigator.share({ title: '帮帮小星 - 星光感悟', text: shareText, url: location.href }).catch(function() {});
    } else {
      var input = document.createElement('textarea');
      input.value = shareText;
      document.body.appendChild(input);
      input.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(input);
      shareBtn.textContent = '✅ 已复制到剪贴板';
      setTimeout(function() { shareBtn.textContent = '📤 分享我的星光感悟'; }, 2000);
    }
  });

  // ====== 返回小星的家：淡出 0.5s 后直达 Hub（index.html#hub） ======
  function goHome() {
    document.body.style.animation = 'none';
    document.body.style.transition = 'opacity .45s ease';
    document.body.style.opacity = '0';
    setTimeout(function() { location.href = 'index.html#hub'; }, 450);
  }
  treeBackBtn.addEventListener('click', function(e) { e.preventDefault(); goHome(); });
  var backLink = document.querySelector('.back-link');
  if (backLink) {
    backLink.setAttribute('href', 'index.html#hub');
    backLink.addEventListener('click', function(e) { e.preventDefault(); goHome(); });
  }
  (function addFadeIn() {
    var st = document.createElement('style');
    st.textContent = '@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}html,body{animation:pageFadeIn .5s ease both}';
    document.head.appendChild(st);
  })();

  // ====== 初始化 ======
  renderScenario();
})();
</script>

<script>
/* ====== 如果我是小星 · 情境模拟 ====== */
(function() {
  var SCENES = [
    {
      tag: '社交 · 邀请',
      img: 'help_img/scene1.jpg',
      caption: '生日会现场：人很多，音乐很吵',
      desc: '同学邀请小星去参加生日会，那里会有很多人、很吵的音乐、还有很多不认识的小朋友。',
      go: '好的，我去试试看 💚',
      nope: '我不太想去 💔',
      truth: '小星其实有点想去，因为同学很友好。但她担心人多、声音大，怕自己受不了。如果她知道可以随时离开、有安静的角落可以待，她可能就敢去了 💛'
    },
    {
      tag: '日常 · 穿衣',
      img: 'help_img/scene2.jpg',
      caption: '新毛衣很漂亮，但毛线摸起来有点扎',
      desc: '妈妈给小星拿来一件新毛衣，颜色很漂亮，但毛线摸起来有点扎手。',
      go: '穿上吧，妈妈挑的应该很舒服 💚',
      nope: '我不想穿，太扎人了 💔',
      truth: '小星知道妈妈是爱她的，但那件毛衣的毛线真的让她皮肤发痒。不是她挑剔，是触觉敏感让每一根毛线都在"说话"。如果妈妈能换一件软一点的，她会很开心的 🧡'
    },
    {
      tag: '课堂 · 发言',
      img: 'help_img/scene3.jpg',
      caption: '课堂上老师提问，小星知道答案',
      desc: '语文课上，老师问了一个小星知道答案的问题，她犹豫要不要举手。',
      go: '举手回答吧 💚',
      nope: '还是不要举手了 💔',
      truth: '小星知道答案！她真的很想举手。但她担心自己说话太慢、声音太小，大家会等她等得不耐烦。如果老师能多给她几秒钟，她其实可以回答得很好的 💛'
    },
    {
      tag: '户外 · 感官',
      img: 'help_img/scene4.jpg',
      caption: '商场里灯光很亮、人很多、声音很大',
      desc: '周末，爸爸带小星去逛商场。商场里灯光很亮、人很多、广播声音很大。',
      go: '好的，我和爸爸一起去 💚',
      nope: '我不想进去，外面等就好 💔',
      truth: '小星想和爸爸一起逛商场，但商场的灯光像聚光灯一样刺眼，广播声像在耳边敲鼓。不是她不想陪爸爸，是感官过载让她真的很难受。如果爸爸能带她去一个安静一点的角落休息一下，她会很感激的 🌿'
    }
  ];

  var idx = 0;
  var card = document.getElementById('empathyCard');
  var progress = document.getElementById('empathyProgress');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  function render() {
    var s = SCENES[idx];
    card.classList.add('scenario-fade-in');
    setTimeout(function() { card.classList.remove('scenario-fade-in'); }, 450);
  var navHtml =
    '<div class="ep-nav">' +
      '<button class="ep-prev" id="epPrev"' + (idx > 0 ? '' : ' disabled') + '>← 上一个情境</button>' +
      '<button class="ep-next" id="epNext">' + (idx < SCENES.length - 1 ? '下一个情境 →' : '看看我的收获 ✨') + '</button>' +
    '</div>';
    card.innerHTML =
      '<div class="ep-top">' +
        '<div class="ep-media">' +
          '<img src="' + s.img + '" alt="' + escapeHtml(s.tag) + '" ' +
               'onerror="this.closest(\'.ep-media\').style.display=\'none\'">' +
          '<div class="ep-caption">' + escapeHtml(s.caption || '') + '</div>' +
        '</div>' +
        '<div class="ep-body">' +
          '<span class="ep-tag">' + escapeHtml(s.tag) + '</span>' +
          '<div class="ep-scene">' + escapeHtml(s.desc) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ep-choices" id="epChoices">' +
        '<button class="ep-btn go" data-pick="go">' + escapeHtml(s.go) + '</button>' +
        '<button class="ep-btn nope" data-pick="nope">' + escapeHtml(s.nope) + '</button>' +
      '</div>' +
      '<div class="ep-truth" id="epTruth">' +
        '<div class="ep-truth-inner">' +
          '<div class="ep-truth-head">🧒 小星的真实想法</div>' +
          '<div class="ep-truth-text">' + escapeHtml(s.truth) + '</div>' +
        '</div>' +
      '</div>' +
      navHtml;
    progress.textContent = '已完成 ' + idx + '/' + SCENES.length + ' 个情境';

    var buttons = card.querySelectorAll('.ep-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function() { choose(this); });
    }
    document.getElementById('epNext').addEventListener('click', next);
    var prevBtn = document.getElementById('epPrev');
    if (prevBtn) prevBtn.addEventListener('click', prev);
  }

  function choose(btn) {
    var choices = document.getElementById('epChoices');
    if (choices.classList.contains('answered')) return;
    choices.classList.add('answered');
    btn.classList.add('picked');

    // 卡片轻微翻转动画 + 展开小星真实想法
    card.classList.add('ep-flip');
    setTimeout(function() { card.classList.remove('ep-flip'); }, 520);
    document.getElementById('epTruth').classList.add('show');
    document.getElementById('epNext').classList.add('show');
    progress.textContent = '已完成 ' + (idx + 1) + '/' + SCENES.length + ' 个情境';
  }

  function next() {
    idx++;
    if (idx < SCENES.length) {
      render();
    } else {
      showDone();
    }
    var section = document.getElementById('empathySection');
    setTimeout(function() { section.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  }

  function prev() {
    if (idx <= 0) return;
    idx--;
    render();
    var section = document.getElementById('empathySection');
    setTimeout(function() { section.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  }

  function showDone() {
    card.innerHTML =
      '<div class="ep-done">' +
        '<div class="ep-done-icon">🎉</div>' +
        '<div class="ep-done-title">体验完成！</div>' +
        '<div class="ep-done-text">你完成了 <b>' + SCENES.length + '</b> 个情境的体验，更了解小星了 🌟<br>想继续走进她的世界吗？</div>' +
        '<button class="ep-restart" id="epRestart">🔄 再体验一遍</button>' +
        '<button class="ep-restart" id="epToFriend" style="margin-left:10px;">💚 去当小星的朋友</button>' +
      '</div>';
    progress.textContent = '已完成 ' + SCENES.length + '/' + SCENES.length + ' 个情境';
    document.getElementById('epRestart').addEventListener('click', function() {
      idx = 0;
      render();
    });
    document.getElementById('epToFriend').addEventListener('click', function() {
      document.body.setAttribute('data-mode', 'friend');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  render();
})();

/* ====== 模式选择：如果我是小星 / 如果我是小星的朋友 ====== */
(function() {
  function setMode(mode) {
    if (mode) {
      document.body.setAttribute('data-mode', mode);
    } else {
      document.body.removeAttribute('data-mode');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('modeEmpathy').addEventListener('click', function() { setMode('empathy'); });
  document.getElementById('modeFriend').addEventListener('click', function() { setMode('friend'); });

  var backs = document.querySelectorAll('[data-back]');
  for (var i = 0; i < backs.length; i++) {
    backs[i].addEventListener('click', function() { setMode(null); });
  }
})();
</script>

</body>
</html>
