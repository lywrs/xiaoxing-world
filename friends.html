      title: '《残疾人保障和发展“十五五”规划》发布：孤独症全生命周期关爱促进行动单列专栏',
      links: [{ text: '阅读全文 →', url: 'https://www.minqin.gov.cn/art/2026/8/11/art_4695_1662454.html' }]
    }
  ];

  // 分类配置：key 与上面 category 字段对应
  var CATEGORIES = [
    { key: 'science', label: '📚 科普知识', desc: '认识自闭症：早期征兆、干预、感官、社交、就业科普', color: 'purple' },
    { key: 'story',   label: '🌟 真实故事', desc: '一个个真实的人和家：父母、孩子、店主、老师的经历', color: 'gold' },
    { key: 'policy',  label: '📋 政策资讯', desc: '就业支持、社会融合、无障碍环境等资讯与案例', color: 'blue' }
  ];

  // 分类标签颜色映射（淡紫/暖金/淡蓝）
  var CATEGORY_TAG_STYLES = {
    purple: { bg: 'rgba(180,150,210,0.18)', color: '#7B4FA8', border: 'rgba(180,150,210,0.42)' },
    gold:   { bg: 'rgba(212,165,116,0.18)', color: '#A5793D', border: 'rgba(212,165,116,0.42)' },
    blue:   { bg: 'rgba(120,170,210,0.18)', color: '#3D6E9E', border: 'rgba(120,170,210,0.42)' }
  };

  // 朋友头像图片池：每张卡片随机抽取一张（图片加载失败时回退为 👤 表情）
  var AVATARS = ['人物1.webp', '人物2.webp', '人物3.webp', '人物4.webp', '人物5.webp', '人物6.webp', '人物7.webp', '人物8.webp'];
  function randomAvatarHTML() {
    var src = AVATARS[Math.floor(Math.random() * AVATARS.length)];
    return '<div class="feed-avatar">👤<img src="' + src + '" alt="" onerror="this.remove()"></div>';
  }

  // ====== DOM ======
  var tabNav = document.getElementById('tabNav');
  var tabPanels = document.getElementById('tabPanels');

  // ====== 随机选取子集 ======
  function pickRandom(arr, count) {
    var copy = arr.slice();
    copy.sort(function() { return Math.random() - 0.5; });
    return copy.slice(0, count);
  }

  // ====== 渲染单张卡片 ======
  function buildCard(f) {
    var linksHTML = '';
    f.links.forEach(function(l) {
      var domain = l.url.replace(/^https?:\/\//, '').split('/')[0];
      linksHTML += '<a class="feed-link" href="' + l.url + '" target="_blank" rel="noopener">' +
        '<span class="feed-link-icon">📎</span>' +
        '<span class="feed-link-text">' + (l.text || '查看资料 →') + '</span>' +
        '<span class="feed-link-domain">' + domain + '</span>' +
        '</a>';
    });
    var card = document.createElement('div');
    card.className = 'feed-card';
    // 分类小徽章（颜色按分类变化）
    var catCfg = CATEGORIES.find(function(c) { return c.key === f.category; });
    var tagHTML = '';
    if (catCfg) {
      var s = CATEGORY_TAG_STYLES[catCfg.color] || CATEGORY_TAG_STYLES.gold;
      tagHTML = '<span class="feed-cat-tag" style="background:' + s.bg + ';color:' + s.color + ';border-color:' + s.border + ';">' + catCfg.label + '</span>';
    }
    card.innerHTML =
      '<div class="feed-header">' +
        randomAvatarHTML() +
        '<div class="feed-info">' +
          '<div class="feed-name">' + f.name + '</div>' +
          '<div class="feed-time">' + f.time + '</div>' +
          tagHTML +
        '</div>' +
      '</div>' +
      '<div class="feed-title">' + f.title + '</div>' +
      (f.desc ? '<div class="feed-desc">' + f.desc + '</div>' : '') +
      '<div class="feed-links">' + linksHTML + '</div>';
    return card;
  }

  // ====== 按分类生成 Tab + 面板 ======
  CATEGORIES.forEach(function(cat, idx) {
    // Tab 按钮
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = cat.label;
    btn.setAttribute('data-tab', cat.key);
    btn.addEventListener('click', function() {
      // 切换按钮 active
      tabNav.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      // 切换面板 active
      tabPanels.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      var panel = tabPanels.querySelector('[data-panel="' + cat.key + '"]');
      if (panel) panel.classList.add('active');
      // 滚动到 Tab 顶部，避免切换后位置错乱
      try { tabNav.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    });
    tabNav.appendChild(btn);

    // 面板容器
    var panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
    panel.setAttribute('data-panel', cat.key);

    // 分类描述
    var desc = document.createElement('div');
    desc.className = 'tab-panel-desc';
    desc.textContent = cat.desc;
    panel.appendChild(desc);

    // 文章列表（每个分类下的文章，随机抽取 4-6 篇展示，刷新变化）
    var catArticles = allFeedTopics.filter(function(a) { return a.category === cat.key; });
    var pickCount = Math.min(catArticles.length, 4 + Math.floor(Math.random() * 3)); // 4-6 篇
    var picked = pickRandom(catArticles, pickCount);

    var list = document.createElement('div');
    list.className = 'feed-list';
    if (picked.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'tab-empty';
      empty.textContent = '这个分类暂时还没有内容哦，小星会慢慢补充～';
      panel.appendChild(empty);
    } else {
      picked.forEach(function(f) { list.appendChild(buildCard(f)); });
      panel.appendChild(list);
    }
    tabPanels.appendChild(panel);
  });

  // ====== 返回小星的家：淡出 0.5s 后直达 Hub（index.html#hub） ======
  (function addFadeIn() {
    var st = document.createElement('style');
    st.textContent = '@keyframes pageFadeIn{from{opacity:0}to{opacity:1}}html,body{animation:pageFadeIn .5s ease both}';
    document.head.appendChild(st);
  })();
  var backLink = document.querySelector('.back-link');
  if (backLink) {
    backLink.setAttribute('href', 'index.html#hub');
    backLink.addEventListener('click', function(e) {
      e.preventDefault();
      document.body.style.animation = 'none';
      document.body.style.transition = 'opacity .45s ease';
      document.body.style.opacity = '0';
      setTimeout(function() { location.href = 'index.html#hub'; }, 450);
    });
  }
})();
</script>

</body>
</html>
